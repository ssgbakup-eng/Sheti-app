name: Build Sheti APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti App V27
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. EXTRACT V25 + V27
      # ------------------------------------------------------------
      - name: Extract V25 and V27 Sources
        shell: bash
        run: |
          set -euo pipefail

          V25_ZIP="Sheti_V4_25.zip"
          V27_ZIP="Sheti_V4_27_JVM_FIXED.zip"

          test -f "$V25_ZIP" || {
            echo "ERROR: $V25_ZIP not found."
            exit 1
          }

          test -f "$V27_ZIP" || {
            echo "ERROR: $V27_ZIP not found."
            exit 1
          }

          rm -rf /tmp/sheti_v25 /tmp/sheti_v27
          mkdir -p /tmp/sheti_v25 /tmp/sheti_v27

          unzip -q "$V25_ZIP" -d /tmp/sheti_v25
          unzip -q "$V27_ZIP" -d /tmp/sheti_v27

          echo "V25 and V27 ZIP files extracted."


      # ------------------------------------------------------------
      # 3. LOCATE V25 PROJECT
      # ------------------------------------------------------------
      - name: Locate V25 Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          V25_PUBSPEC="$(find /tmp/sheti_v25 \
            -name pubspec.yaml \
            -type f \
            -print -quit)"

          if [ -z "$V25_PUBSPEC" ]; then
            echo "ERROR: V25 pubspec.yaml not found."
            exit 1
          fi

          V25_DIR="$(dirname "$V25_PUBSPEC")"

          echo "V25_DIR=$V25_DIR" >> "$GITHUB_ENV"

          test -d "$V25_DIR/android" || {
            echo "ERROR: V25 Android project not found."
            echo "Expected: $V25_DIR/android"
            exit 1
          }

          echo "V25 project found:"
          echo "$V25_DIR"


      # ------------------------------------------------------------
      # 4. LOCATE V27 PROJECT
      # ------------------------------------------------------------
      - name: Locate V27 Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          V27_PUBSPEC="$(find /tmp/sheti_v27 \
            -name pubspec.yaml \
            -type f \
            -print -quit)"

          if [ -z "$V27_PUBSPEC" ]; then
            echo "ERROR: V27 pubspec.yaml not found."
            exit 1
          fi

          V27_DIR="$(dirname "$V27_PUBSPEC")"

          echo "V27_DIR=$V27_DIR" >> "$GITHUB_ENV"

          test -f "$V27_DIR/lib/main.dart" || {
            echo "ERROR: V27 lib/main.dart not found."
            exit 1
          }

          echo "V27 project found:"
          echo "$V27_DIR"


      # ------------------------------------------------------------
      # 5. READ V25 PACKAGE ID
      # ------------------------------------------------------------
      - name: Read V25 Package ID
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find "$V25_DIR/android/app" \
            -maxdepth 2 \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -type f \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: V25 Android app build file not found."
            exit 1
          fi

          echo "V25 Android build file:"
          echo "$BUILD_FILE"

          PACKAGE_ID="$(grep -Eo \
            'applicationId[[:space:]]*[=]?[[:space:]]*["'\''][^"'\'']+["'\'']' \
            "$BUILD_FILE" \
            | head -n 1 \
            | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')"

          if [ -z "$PACKAGE_ID" ]; then
            echo "ERROR: Could not read V25 applicationId."
            exit 1
          fi

          echo "V25_PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"

          echo "V25 package ID = $PACKAGE_ID"


      # ------------------------------------------------------------
      # 6. READ V25 VERSION CODE
      # ------------------------------------------------------------
      - name: Read V25 Version Code
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find "$V25_DIR/android/app" \
            -maxdepth 2 \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -type f \
            -print -quit)"

          V25_VERSION_CODE="$(grep -E \
            'versionCode[[:space:]]*[=]?[[:space:]]*[0-9]+' \
            "$BUILD_FILE" \
            | head -n 1 \
            | grep -Eo '[0-9]+' \
            | tail -n 1 || true)"

          if [ -z "$V25_VERSION_CODE" ]; then
            echo "WARNING: V25 versionCode not directly found."
            V25_VERSION_CODE="1"
          fi

          echo "V25_VERSION_CODE=$V25_VERSION_CODE" >> "$GITHUB_ENV"

          echo "Installed/base V25 versionCode = $V25_VERSION_CODE"


      # ------------------------------------------------------------
      # 7. COPY V27 SOURCE TO WORKSPACE
      # ------------------------------------------------------------
      - name: Prepare V27 Source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE"/lib
          rm -rf "$GITHUB_WORKSPACE"/assets
          rm -f "$GITHUB_WORKSPACE"/pubspec.yaml
          rm -f "$GITHUB_WORKSPACE"/pubspec.lock

          cp -a "$V27_DIR"/lib "$GITHUB_WORKSPACE"/
          cp -a "$V27_DIR"/pubspec.yaml "$GITHUB_WORKSPACE"/

          if [ -d "$V27_DIR/assets" ]; then
            cp -a "$V27_DIR/assets" "$GITHUB_WORKSPACE"/
          fi

          if [ -d "$V27_DIR/test" ]; then
            rm -rf "$GITHUB_WORKSPACE"/test
            cp -a "$V27_DIR/test" "$GITHUB_WORKSPACE"/
          fi

          echo "V27 Dart source copied."


      # ------------------------------------------------------------
      # 8. COPY V25 ANDROID PROJECT
      # ------------------------------------------------------------
      - name: Preserve V25 Android Identity
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/android"

          cp -a "$V25_DIR/android" "$GITHUB_WORKSPACE/android"

          test -d android/app
          test -f android/app/src/main/AndroidManifest.xml

          echo "V25 Android project preserved."


      # ------------------------------------------------------------
      # 9. COPY V25 SIGNING FILES
      # ------------------------------------------------------------
      - name: Preserve V25 Signing Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/signing

          KEY_PROPERTIES="$(find "$V25_DIR" \
            -name "key.properties" \
            -type f \
            -print -quit || true)"

          JKS_FILE="$(find "$V25_DIR" \
            \( -name "*.jks" -o -name "*.keystore" \) \
            -type f \
            -print -quit || true)"

          if [ -z "$KEY_PROPERTIES" ]; then
            echo "ERROR: V25 key.properties not found."
            exit 1
          fi

          if [ -z "$JKS_FILE" ]; then
            echo "ERROR: V25 signing keystore not found."
            exit 1
          fi

          cp "$KEY_PROPERTIES" android/signing/key.properties
          cp "$JKS_FILE" android/signing/

          echo "V25 signing files preserved."

          echo "Signing files:"
          ls -lh android/signing/


      # ------------------------------------------------------------
      # 10. SET JAVA 17
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ------------------------------------------------------------
      # 11. SET FLUTTER
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true


      # ------------------------------------------------------------
      # 12. ENSURE FLUTTER ANDROID GRADLE
      # ------------------------------------------------------------
      - name: Ensure Flutter Android Project
        shell: bash
        run: |
          set -euo pipefail

          flutter doctor -v

          test -f android/app/build.gradle \
            || test -f android/app/build.gradle.kts

          echo "Android project available."


      # ------------------------------------------------------------
      # 13. VERIFY PACKAGE ID
      # ------------------------------------------------------------
      - name: Verify Package Identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected V25 package ID:"
          echo "$V25_PACKAGE_ID"

          if grep -Rqs \
            "applicationId.*$V25_PACKAGE_ID" \
            android/app; then
            echo "Package identity preserved."
          else
            echo "ERROR: V25 package identity was not preserved."
            exit 1
          fi


      # ------------------------------------------------------------
      # 14. FORCE VERSION CODE 27
      # ------------------------------------------------------------
      - name: Set V27 Version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          # Keep the existing version name if present.
          # Force build number to 27.
          m = re.search(
              r'(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\s*$',
              s
          )

          if m:
              version_name = m.group(1)
              s = re.sub(
                  r'(?m)^version:\s*.*$',
                  f'version: {version_name}+27',
                  s,
                  count=1
              )
          else:
              s = "version: 4.3.0+27\n" + s

          p.write_text(s)

          print("pubspec version updated to build number 27.")
          PY

          grep '^version:' pubspec.yaml


      # ------------------------------------------------------------
      # 15. JAVA / KOTLIN 17
      # ------------------------------------------------------------
      - name: Configure Java and Kotlin 17
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for p in candidates:
              if not p.exists():
                  continue

              s = p.read_text()

              if p.suffix == ".gradle":
                  s = re.sub(
                      r'compileOptions\s*\{.*?\}',
                      '',
                      s,
                      flags=re.S
                  )

                  block = """
          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }
          """

                  marker = "android {"
                  if marker in s:
                      s = s.replace(
                          marker,
                          marker + block,
                          1
                      )

              else:
                  s = re.sub(
                      r'compileOptions\s*\{.*?\}',
                      '',
                      s,
                      flags=re.S
                  )

                  block = """
          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }
          """

                  marker = "android {"
                  if marker in s:
                      s = s.replace(
                          marker,
                          marker + block,
                          1
                      )

              p.write_text(s)

          print("Java/Kotlin 17 configuration applied.")
          PY


      # ------------------------------------------------------------
      # 16. RECORD AUDIO PERMISSION
      # ------------------------------------------------------------
      - name: Configure Audio Permission
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          if ! grep -q \
            "android.permission.RECORD_AUDIO" \
            "$MANIFEST"; then

            sed -i \
              '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
              "$MANIFEST"

          fi

          echo "Audio permission configured."


      # ------------------------------------------------------------
      # 17. FIX IMAGE DEPENDENCY
      # ------------------------------------------------------------
      - name: Fix Image Dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          # Remove old image version if directly declared.
          s = re.sub(
              r'(?m)^[ \t]*image:[ \t]*.*$',
              '  image: ^4.9.2',
              s,
              count=1
          )

          # If image is not present, add it under dependencies.
          if not re.search(r'(?m)^[ \t]+image:\s*', s):
              m = re.search(r'(?m)^dependencies:\s*\n', s)

              if not m:
                  raise SystemExit(
                      "ERROR: dependencies section not found."
                  )

              s = s[:m.end()] + \
                  "  image: ^4.9.2\n" + \
                  s[m.end():]

          # Remove dependency_overrides completely.
          s = re.sub(
              r'(?ms)^dependency_overrides:\s*\n.*?(?=^[A-Za-z_][A-Za-z0-9_]*\s*:|\Z)',
              '',
              s
          )

          p.write_text(s)

          print("Using image ^4.9.2.")
          PY

          rm -f pubspec.lock

          flutter pub get


      # ------------------------------------------------------------
      # 18. VERIFY DEPENDENCIES
      # ------------------------------------------------------------
      - name: Verify Flutter Dependencies
        shell: bash
        run: |
          set -euo pipefail

          flutter pub deps > /tmp/sheti_deps.txt

          grep -E \
            'image|archive|pdf' \
            /tmp/sheti_deps.txt || true

          echo "Dependency resolution completed."


      # ------------------------------------------------------------
      # 19. BUILD APK
      # ------------------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --build-number=27 \
            --target-platform android-arm64

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          echo "APK successfully created."
          ls -lh "$APK"


      # ------------------------------------------------------------
      # 20. VERIFY APK
      # ------------------------------------------------------------
      - name: Verify APK Package and Signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" \
            -name apksigner \
            -type f \
            2>/dev/null \
            | sort -V \
            | tail -n 1)"

          AAPT="$(find "$SDK_ROOT/build-tools" \
            -name aapt \
            -type f \
            2>/dev/null \
            | sort -V \
            | tail -n 1)"

          test -n "$APKSIGNER"
          test -n "$AAPT"

          echo "========== APK SIGNATURE =========="
          "$APKSIGNER" verify --verbose "$APK"

          "$APKSIGNER" verify --print-certs "$APK"

          echo "========== APK PACKAGE =========="

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep "^package:"

          echo "$BADGING" | \
            grep -q "name='$V25_PACKAGE_ID'" || {
              echo "ERROR: APK package ID does not match V25."
              echo "Expected: $V25_PACKAGE_ID"
              exit 1
            }

          echo "$BADGING" | \
            grep -q "versionCode='27'" || {
              echo "ERROR: APK versionCode is not 27."
              exit 1
            }

          echo "================================="
          echo "PACKAGE ID CHECK: PASSED"
          echo "VERSION CODE CHECK: PASSED"
          echo "SIGNATURE CHECK: PASSED"


      # ------------------------------------------------------------
      # 21. COPY RELEASE APK
      # ------------------------------------------------------------
      - name: Prepare Release Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Sheti_V27_Update.apk

          sha256sum \
            release/Sheti_V27_Update.apk \
            > release/SHA256SUMS.txt

          ls -lh release/


      # ------------------------------------------------------------
      # 22. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V27-Update-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
