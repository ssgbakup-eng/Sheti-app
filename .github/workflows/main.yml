name: Build Sheti APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti App V27
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. EXTRACT V25 AND V27
      # ==================================================
      - name: Extract V25 and V27 Sources
        shell: bash
        run: |
          set -euo pipefail

          V25_ZIP="Sheti_V4_25.zip"
          V27_ZIP="Sheti_V4_27_JVM_FIXED.zip"

          if [ ! -f "$V25_ZIP" ]; then
            echo "ERROR: $V25_ZIP not found."
            exit 1
          fi

          if [ ! -f "$V27_ZIP" ]; then
            echo "ERROR: $V27_ZIP not found."
            exit 1
          fi

          rm -rf /tmp/sheti_v25
          rm -rf /tmp/sheti_v27

          mkdir -p /tmp/sheti_v25
          mkdir -p /tmp/sheti_v27

          unzip -q "$V25_ZIP" -d /tmp/sheti_v25
          unzip -q "$V27_ZIP" -d /tmp/sheti_v27

          echo "V25 and V27 ZIP extraction completed."


      # ==================================================
      # 3. LOCATE V25 PROJECT
      # ==================================================
      - name: Locate V25 Android Project
        shell: bash
        run: |
          set -euo pipefail

          V25_BUILD_GRADLE="$(
            find /tmp/sheti_v25 \
              -path "*/android/app/build.gradle" \
              -type f \
              -print -quit
          )"

          if [ -z "$V25_BUILD_GRADLE" ]; then
            V25_BUILD_GRADLE="$(
              find /tmp/sheti_v25 \
                -path "*/android/app/build.gradle.kts" \
                -type f \
                -print -quit
            )"
          fi

          if [ -z "$V25_BUILD_GRADLE" ]; then
            echo "ERROR: V25 Android app build file not found."
            exit 1
          fi

          V25_PROJECT_DIR="$(dirname "$(dirname "$(dirname "$V25_BUILD_GRADLE")")")"

          echo "V25_BUILD_GRADLE=$V25_BUILD_GRADLE" \
            >> "$GITHUB_ENV"

          echo "V25_PROJECT_DIR=$V25_PROJECT_DIR" \
            >> "$GITHUB_ENV"

          echo "V25 project found."


      # ==================================================
      # 4. READ V25 PACKAGE ID
      # ==================================================
      - name: Read V25 Package ID
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["V25_BUILD_GRADLE"])
          s = p.read_text()

          patterns = [
              r'applicationId\s+["\']([^"\']+)["\']',
              r'applicationId\s*=\s*["\']([^"\']+)["\']'
          ]

          package_id = None

          for pattern in patterns:
              m = re.search(pattern, s)
              if m:
                  package_id = m.group(1)
                  break

          if not package_id:
              raise SystemExit(
                  "ERROR: V25 applicationId could not be determined."
              )

          print("----------------------------------------")
          print("V25 PACKAGE ID")
          print(package_id)
          print("----------------------------------------")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"V25_PACKAGE_ID={package_id}\n")
          PY


      # ==================================================
      # 5. READ V25 VERSION CODE
      # ==================================================
      - name: Read V25 Version Code
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["V25_BUILD_GRADLE"])
          s = p.read_text()

          patterns = [
              r'versionCode\s+(\d+)',
              r'versionCode\s*=\s*(\d+)'
          ]

          version_code = None

          for pattern in patterns:
              m = re.search(pattern, s)
              if m:
                  version_code = int(m.group(1))
                  break

          if version_code is None:
              raise SystemExit(
                  "ERROR: V25 versionCode could not be determined."
              )

          print("----------------------------------------")
          print("V25 VERSION CODE")
          print(version_code)
          print("----------------------------------------")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"V25_VERSION_CODE={version_code}\n")
          PY


      # ==================================================
      # 6. LOCATE V25 SIGNING FILES
      # ==================================================
      - name: Locate V25 Signing Files
        shell: bash
        run: |
          set -euo pipefail

          V25_KEY_PROPERTIES="$(
            find /tmp/sheti_v25 \
              -name "key.properties" \
              -type f \
              -print -quit
          )"

          V25_JKS="$(
            find /tmp/sheti_v25 \
              \( -name "*.jks" -o -name "*.keystore" \) \
              -type f \
              -print -quit
          )"

          if [ -z "$V25_KEY_PROPERTIES" ]; then
            echo "ERROR: V25 key.properties not found."
            exit 1
          fi

          if [ -z "$V25_JKS" ]; then
            echo "ERROR: V25 signing keystore not found."
            exit 1
          fi

          echo "V25_KEY_PROPERTIES=$V25_KEY_PROPERTIES" \
            >> "$GITHUB_ENV"

          echo "V25_JKS=$V25_JKS" \
            >> "$GITHUB_ENV"

          echo "V25 signing files found."


      # ==================================================
      # 7. LOCATE V27 PROJECT
      # ==================================================
      - name: Locate V27 Project
        shell: bash
        run: |
          set -euo pipefail

          V27_PUBSPEC="$(
            find /tmp/sheti_v27 \
              -name "pubspec.yaml" \
              -type f \
              -print -quit
          )"

          if [ -z "$V27_PUBSPEC" ]; then
            echo "ERROR: V27 pubspec.yaml not found."
            exit 1
          fi

          V27_PROJECT_DIR="$(dirname "$V27_PUBSPEC")"

          cp -a "$V27_PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "V27 source copied to workspace."


      # ==================================================
      # 8. SETUP JAVA 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 9. SETUP FLUTTER
      # ==================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true


      # ==================================================
      # 10. CREATE ANDROID PROJECT ONLY IF MISSING
      # ==================================================
      - name: Ensure Android Project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "android/app/build.gradle" ] || \
             [ -f "android/app/build.gradle.kts" ]; then

            echo "V27 Android project already exists."

          else

            echo "V27 Android project missing."
            echo "Creating Android project..."

            flutter create \
              --platforms=android \
              --project-name sheti_app \
              --org com.example \
              .

          fi

          if [ ! -f "android/app/build.gradle" ] && \
             [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: Android project unavailable."
            exit 1
          fi


      # ==================================================
      # 11. APPLY V25 PACKAGE ID
      # ==================================================
      - name: Enforce V25 Package ID
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          package_id = os.environ["V25_PACKAGE_ID"]

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          s = p.read_text()

          s = re.sub(
              r'applicationId\s+["\'][^"\']+["\']',
              f'applicationId "{package_id}"',
              s,
              count=1
          )

          if "applicationId" not in s:
              raise SystemExit(
                  "ERROR: applicationId could not be inserted."
              )

          p.write_text(s)

          print("----------------------------------------")
          print("V27 PACKAGE ID FORCED TO V25 PACKAGE ID")
          print(package_id)
          print("----------------------------------------")
          PY


      # ==================================================
      # 12. COPY V25 SIGNING CONFIG
      # ==================================================
      - name: Apply V25 Signing Configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/signing

          cp "$V25_KEY_PROPERTIES" \
            android/signing/key.properties

          cp "$V25_JKS" \
            android/signing/sheti-release.jks

          echo "V25 signing files copied."


      # ==================================================
      # 13. FORCE VERSION CODE 27
      # ==================================================
      - name: Set V27 Version Code
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          s = p.read_text()

          if re.search(r'versionCode\s+\d+', s):
              s = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 27',
                  s,
                  count=1
              )
          elif re.search(r'versionCode\s*=\s*\d+', s):
              s = re.sub(
                  r'versionCode\s*=\s*\d+',
                  'versionCode = 27',
                  s,
                  count=1
              )
          else:
              raise SystemExit(
                  "ERROR: versionCode not found."
              )

          p.write_text(s)

          print("V27 versionCode = 27")
          PY


      # ==================================================
      # 14. VERIFY VERSION
      # ==================================================
      - name: Verify V25 to V27 Version Upgrade
        shell: bash
        run: |
          set -euo pipefail

          if [ "$V25_VERSION_CODE" -ge 27 ]; then
            echo "ERROR: V27 versionCode 27 is not greater than V25."
            echo "V25 versionCode = $V25_VERSION_CODE"
            exit 1
          fi

          echo "V25 versionCode = $V25_VERSION_CODE"
          echo "V27 versionCode = 27"
          echo "Version upgrade verified."


      # ==================================================
      # 15. CONFIGURE FLUTTER GRADLE
      # ==================================================
      - name: Configure Flutter Gradle
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          flutter_plugin = \
              'id "dev.flutter.flutter-gradle-plugin"'

          if flutter_plugin not in s:
              marker = 'id "org.jetbrains.kotlin.android"'

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\n    " + flutter_plugin,
                      1
                  )

          if "flutter {" not in s:
              s += """

          flutter {
              source = "../.."
          }
          """

          p.write_text(s)
          PY


      # ==================================================
      # 16. JAVA / KOTLIN 17
      # ==================================================
      - name: Configure Java and Kotlin 17
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "compileOptions" not in s:
              s += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

          if "jvmTarget = \"17\"" not in s:
              s += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)
          PY

          grep -q \
            'sourceCompatibility JavaVersion.VERSION_17' \
            android/app/build.gradle

          grep -q \
            'targetCompatibility JavaVersion.VERSION_17' \
            android/app/build.gradle

          grep -q \
            'jvmTarget = "17"' \
            android/app/build.gradle

          echo "Java 17 / Kotlin 17 verified."


      # ==================================================
      # 17. AUDIO PERMISSION
      # ==================================================
      - name: Configure Audio Permission
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ] && \
             ! grep -q \
             "android.permission.RECORD_AUDIO" \
             "$MANIFEST"; then

            sed -i \
              '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
              "$MANIFEST"
          fi


      # ==================================================
      # 18. IMAGE DEPENDENCY
      # ==================================================
      - name: Fix Image Dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          s = re.sub(
              r"(?m)^[ \t]*image:[ \t]*4\.9\.1[ \t]*\n?",
              "",
              s
          )

          s = re.sub(
              r"(?m)^[ \t]*image:[ \t]*4\.11\.1[ \t]*\n?",
              "",
              s
          )

          s = re.sub(
              r"(?m)^[ \t]*image:[ \t]*4\.5\.4[ \t]*\n?",
              "",
              s
          )

          s = re.sub(
              r"(?ms)^dependency_overrides:[ \t]*\n.*?(?=^[A-Za-z_][A-Za-z0-9_]*[ \t]*:|\Z)",
              "",
              s
          )

          s = s.rstrip()

          s += """

          dependency_overrides:
            image: 4.5.4
          """

          p.write_text(s)
          PY

          rm -f pubspec.lock

          flutter pub get


      # ==================================================
      # 19. BUILD
      # ==================================================
      - name: Build V27 Release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --target-platform android-arm64

          test -s \
            build/app/outputs/flutter-apk/app-release.apk

          echo "V27 APK BUILD SUCCESSFUL."


      # ==================================================
      # 20. APK PACKAGE CHECK
      # ==================================================
      - name: Verify APK Package and Version
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$(
            find "$SDK_ROOT/build-tools" \
              -name aapt \
              -type f \
              2>/dev/null |
            sort -V |
            tail -n 1
          )"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -name apksigner \
              -type f \
              2>/dev/null |
            sort -V |
            tail -n 1
          )"

          if [ -z "$AAPT" ] || [ -z "$APKSIGNER" ]; then
            echo "ERROR: Android verification tools missing."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "----------------------------------------"
          echo "V27 APK PACKAGE"
          echo "----------------------------------------"

          echo "$BADGING" | grep "^package:"

          echo "$BADGING" | grep -q \
            "name='$V25_PACKAGE_ID'" || {

            echo "ERROR: V27 package ID does not match V25."
            echo "Expected: $V25_PACKAGE_ID"

            exit 1
          }

          echo "Package ID MATCHED V25."


      # ==================================================
      # 21. APK SIGNATURE CHECK
      # ==================================================
      - name: Verify V25 Signing Certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -name apksigner \
              -type f \
              2>/dev/null |
            sort -V |
            tail -n 1
          )"

          echo "----------------------------------------"
          echo "V27 APK CERTIFICATE"
          echo "----------------------------------------"

          "$APKSIGNER" verify \
            --print-certs \
            "$APK"

          echo "----------------------------------------"
          echo "APK SIGNATURE VERIFIED"
          echo "----------------------------------------"


      # ==================================================
      # 22. ZIPALIGN
      # ==================================================
      - name: Verify APK Alignment
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          ZIPALIGN="$(
            find "$SDK_ROOT/build-tools" \
              -name zipalign \
              -type f \
              2>/dev/null |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          "$ZIPALIGN" -c -v 4 "$APK"


      # ==================================================
      # 23. RELEASE
      # ==================================================
      - name: Prepare V27 Release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Sheti_V27_arm64.apk

          sha256sum \
            release/Sheti_V27_arm64.apk \
            > release/SHA256SUMS.txt

          echo "----------------------------------------"
          echo "FINAL V27 RELEASE READY"
          echo "----------------------------------------"

          ls -lh release/


      # ==================================================
      # 24. UPLOAD
      # ==================================================
      - name: Upload V27 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V27-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
