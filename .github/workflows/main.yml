name: Sheti App V25 Base V27

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Flutter 3.35.2
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.2
          channel: stable
          cache: true

      # 3. Find V25 ZIP
      - name: Find V25 Base
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "Sheti_V4_25.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Sheti_V4_25.zip not found"
            exit 1
          fi

          rm -rf sheti_v25
          mkdir -p sheti_v25

          unzip -q "$ZIP" -d sheti_v25

          PROJECT=$(find sheti_v25 \
            -type f \
            -name "pubspec.yaml" \
            -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: V25 pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "========================================"
          echo "V25 BASE FOUND"
          echo "PROJECT: $PROJECT"
          echo "========================================"

      # 4. Read V25 Application ID
      - name: Read V25 Application ID
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT/signing/app_build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: signing/app_build.gradle not found"
            exit 1
          fi

          APP_ID=$(grep -oE \
            'applicationId[[:space:]]*(=)?[[:space:]]*["'\''][^"'\'']+["'\'']' \
            "$APP_GRADLE" \
            | head -1 \
            | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')

          if [ -z "$APP_ID" ]; then
            echo "ERROR: V25 Application ID not found"
            exit 1
          fi

          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

          echo "V25 APPLICATION ID = $APP_ID"

      # 5. Create fresh Android project
      - name: Create Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          rm -rf android

          flutter create \
            --no-pub \
            --platforms=android \
            --project-name sheti_app \
            --org com.sheti \
            .

          if [ ! -d "android" ]; then
            echo "ERROR: Android project creation failed"
            exit 1
          fi

          echo "Android project created"

      # 6. Restore V25 signing files
      - name: Restore V25 Signing
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          test -f signing/key.properties
          test -f signing/sheti-release.jks

          mkdir -p android/signing

          cp -f signing/key.properties \
            android/signing/key.properties

          cp -f signing/sheti-release.jks \
            android/signing/sheti-release.jks

          echo "V25 signing files restored"

      # 7. Configure generated Android app
      - name: Configure Android App
        shell: bash
        env:
          V25_APP_ID: ${{ env.APP_ID }}
        run: |
          set -e

          cd "$PROJECT"

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          app_id = os.environ["V25_APP_ID"]

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # --------------------------------
          # Application ID
          # --------------------------------
          text, count = re.subn(
              r'applicationId\s+["\'][^"\']+["\']',
              f'applicationId "{app_id}"',
              text,
              count=1
          )

          if count == 0:
              raise SystemExit("ERROR: applicationId not found")

          # --------------------------------
          # Version Code
          # --------------------------------
          text, count = re.subn(
              r'versionCode\s+[^\n]+',
              'versionCode 27',
              text,
              count=1
          )

          if count == 0:
              raise SystemExit("ERROR: versionCode not found")

          # --------------------------------
          # Version Name
          # --------------------------------
          text, count = re.subn(
              r'versionName\s+[^\n]+',
              'versionName "4.27.0"',
              text,
              count=1
          )

          if count == 0:
              raise SystemExit("ERROR: versionName not found")

          # --------------------------------
          # V25 Signing Configuration
          # --------------------------------
          signing_block = r'''
              signingConfigs {
                  release {
                      def kp = new Properties()
                      def kpFile = rootProject.file("signing/key.properties")

                      if (kpFile.exists()) {
                          kp.load(new FileInputStream(kpFile))

                          storeFile = rootProject.file(
                              "signing/sheti-release.jks"
                          )

                          storePassword = kp["storePassword"]
                          keyAlias = kp["keyAlias"]
                          keyPassword = kp["keyPassword"]
                      }
                  }
              }

          '''

          if "signingConfigs {" not in text:
              marker = "    buildTypes {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: buildTypes block not found"
                  )

              text = text.replace(
                  marker,
                  signing_block + marker,
                  1
              )

          # --------------------------------
          # Release must use V25 key
          # --------------------------------
          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          path.write_text(text)

          print("========================================")
          print("ANDROID APP CONFIGURED")
          print("Application ID :", app_id)
          print("Version Code   : 27")
          print("Version Name   : 4.27.0")
          print("Signing        : V25")
          print("========================================")
          PY

      # 8. Dependency configuration
      - name: Configure Flutter Dependencies
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text()

          # Remove existing dependency_overrides block
          text = re.sub(
              r'\ndependency_overrides:\n(?:^[ \t]+.*\n?)*',
              '\n',
              text,
              flags=re.MULTILINE
          )

          text = text.rstrip() + """

          dependency_overrides:
            image: 4.11.1
          """

          path.write_text(text)
          PY

          rm -f pubspec.lock

      # 9. Flutter dependencies
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          flutter clean
          flutter pub get

      # 10. Final configuration check
      - name: Final Configuration Check
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo ""
          echo "========================================"
          echo "FINAL CONFIGURATION"
          echo "========================================"

          grep -E \
            "applicationId|versionCode|versionName" \
            android/app/build.gradle

          echo ""
          echo "BASE       : V25"
          echo "BUILD      : V27"
          echo "SIGNING    : V25"
          echo "ARCH       : ARM64"
          echo "========================================"

      # 11. Build ARM64 APK
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          flutter build apk \
            --release \
            --target-platform android-arm64

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK CREATED SUCCESSFULLY"
          ls -lh "$APK"

      # 12. APK package check
      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt \
            | sort -V \
            | tail -1)

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found"
            exit 1
          fi

          "$AAPT" dump badging "$APK" | head -5

          PACKAGE=$(
            "$AAPT" dump badging "$APK" \
            | sed -n "s/package: name='\([^']*\)'.*/\1/p" \
            | head -1
          )

          if [ "$PACKAGE" != "${APP_ID}" ]; then
            echo "ERROR: APK PACKAGE DOES NOT MATCH V25 APP ID"
            echo "Expected: ${APP_ID}"
            echo "Found:    $PACKAGE"
            exit 1
          fi

          echo "APK PACKAGE = V25 APP ID MATCH"

      # 13. APK alignment
      - name: Verify APK Alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -name zipalign \
            | sort -V \
            | tail -1)

          "$ZIPALIGN" -c -v 4 "$APK"

          echo "APK ZIPALIGN = OK"

      # 14. APK signature
      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -1)

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK SIGNATURE = OK"

      # 15. Compare V25 JKS certificate with APK certificate
      - name: Verify V25 Certificate
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK="build/app/outputs/flutter-apk/app-release.apk"
          JKS="android/signing/sheti-release.jks"
          KP="android/signing/key.properties"

          test -f "$JKS"
          test -f "$KP"

          STORE_PASSWORD=$(
            grep '^storePassword=' "$KP" \
            | head -1 \
            | cut -d'=' -f2-
          )

          KEY_ALIAS=$(
            grep '^keyAlias=' "$KP" \
            | head -1 \
            | cut -d'=' -f2-
          )

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: storePassword not found"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: keyAlias not found"
            exit 1
          fi

          JKS_CERT=$(
            keytool -list -v \
              -keystore "$JKS" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -i "SHA256:" \
            | head -1 \
            | sed 's/.*SHA256:[[:space:]]*//'
          )

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -1)

          APK_CERT=$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK" 2>/dev/null \
            | grep -i \
              "Signer #1 certificate SHA-256 digest:" \
            | sed 's/.*digest:[[:space:]]*//'
          )

          JKS_CERT=$(echo "$JKS_CERT" \
            | tr -d ' ' \
            | tr '[:lower:]' '[:upper:]')

          APK_CERT=$(echo "$APK_CERT" \
            | tr -d ' ' \
            | tr '[:lower:]' '[:upper:]')

          echo "V25 certificate fingerprint found"
          echo "APK certificate fingerprint found"

          if [ -z "$JKS_CERT" ] || [ -z "$APK_CERT" ]; then
            echo "ERROR: Certificate fingerprint unavailable"
            exit 1
          fi

          if [ "$JKS_CERT" != "$APK_CERT" ]; then
            echo ""
            echo "========================================"
            echo "ERROR: V25 SIGNING CERTIFICATE MISMATCH"
            echo "========================================"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "V25 CERTIFICATE = MATCH"
          echo "========================================"

      # 16. Final APK
      - name: Prepare Verified APK
        shell: bash
        run: |
          set -e

          cp \
            "$PROJECT/build/app/outputs/flutter-apk/app-release.apk" \
            "$GITHUB_WORKSPACE/Sheti_V27_arm64.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/Sheti_V27_arm64.apk"

      # 17. Build information
      - name: Create Build Information
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/Sheti_V27_Build_Info.txt" <<EOF
          SHETI APP V27

          BASE SOURCE:
          Sheti_V4_25.zip

          APPLICATION ID:
          ${APP_ID}

          VERSION CODE:
          27

          VERSION NAME:
          4.27.0

          SIGNING:
          V25 sheti-release.jks

          ARCHITECTURE:
          ARM64

          VERIFIED:
          APK Package = OK
          APK Alignment = OK
          APK Signature = OK
          V25 Certificate = MATCH

          APK:
          Sheti_V27_arm64.apk
          EOF

      # 18. Upload only verified files
      - name: Upload Verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V27-APK
          path: |
            Sheti_V27_arm64.apk
            Sheti_V27_Build_Info.txt
