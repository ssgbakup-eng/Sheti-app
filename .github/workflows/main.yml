
name: Build Sheti APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti App V27
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Validate V27 Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Sheti_V4_27_JVM_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE repository root मध्ये सापडली नाही."
            echo "GitHub repository मध्ये V27 source ZIP जोडा."
            exit 1
          fi

          mkdir -p /tmp/sheti_v27
          unzip -q "$ZIP_FILE" -d /tmp/sheti_v27

          PUBSPEC="$(find /tmp/sheti_v27 -name pubspec.yaml -type f -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: ZIP मध्ये pubspec.yaml नाही."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f signing/app_build.gradle
          test -f signing/key.properties
          test -f signing/sheti-release.jks

          echo "V27 source and signing files verified."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Generate Android Project
        shell: bash
        run: |
          set -euo pipefail

          flutter create \
            --platforms=android \
            --project-name sheti_app \
            --org com.example \
            .

          test -f android/settings.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/build.gradle

          echo "Android Gradle project created."

      - name: Configure Original Signing and Flutter Gradle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/signing

          cp signing/key.properties \
            android/signing/key.properties

          cp signing/sheti-release.jks \
            android/signing/sheti-release.jks

          cp signing/app_build.gradle \
            android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          required = [
              'id "com.android.application"',
              'id "org.jetbrains.kotlin.android"'
          ]

          for plugin in required:
              if plugin not in s:
                  raise SystemExit(
                      "ERROR: Required Gradle plugin missing: " + plugin
                  )

          flutter_plugin = 'id "dev.flutter.flutter-gradle-plugin"'

          if flutter_plugin not in s:
              marker = 'id "org.jetbrains.kotlin.android"'
              s = s.replace(
                  marker,
                  marker + "\n    " + flutter_plugin,
                  1
              )

          if not re.search(r"(?m)^flutter\s*\{", s):
              s += '\n\nflutter {\n    source = "../.."\n}\n'

          p.write_text(s)

          if 'applicationId "com.example.sheti_app"' not in s:
              raise SystemExit(
                  "ERROR: Expected V25-compatible applicationId was not found."
              )

          if 'versionCode 27' not in s:
              raise SystemExit("ERROR: Expected versionCode 27 was not found.")

          print("Gradle signing configuration prepared.")
          PY

          test -f android/signing/key.properties
          test -f android/signing/sheti-release.jks

      - name: Verify Java and Kotlin Targets
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'sourceCompatibility JavaVersion.VERSION_17' \
            android/app/build.gradle

          grep -q 'targetCompatibility JavaVersion.VERSION_17' \
            android/app/build.gradle

          grep -q 'jvmTarget = "17"' \
            android/app/build.gradle

          echo "Java and Kotlin targets verified."

      - name: Configure Audio Permission
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ] && \
             ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            sed -i \
              '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
              "$MANIFEST"
          fi

      - name: Resolve Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK Package and Signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"

          AAPT="$(find "$SDK_ROOT/build-tools" \
            -name aapt -type f 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "ERROR: Android SDK verification tools not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep "^package:"

          echo "$BADGING" | grep -q "name='com.example.sheti_app'" || {
            echo "ERROR: APK package ID mismatch."
            exit 1
          }

          mkdir -p release
          cp "$APK" release/Sheti_V27_arm64.apk
          sha256sum release/Sheti_V27_arm64.apk \
            > release/SHA256SUMS.txt

          echo "APK package and signature verification passed."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V27-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
