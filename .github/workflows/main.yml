
name: Build Sheti App V27 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V27 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Sheti_V4_27_JVM_FIXED.zip"
          test -f "$ZIP"

          mkdir -p source
          unzip -q "$ZIP" -d source

          if [ -f source/pubspec.yaml ]; then
            ROOT="source"
          else
            PUBSPEC="$(find source -name pubspec.yaml -print -quit)"
            test -n "$PUBSPEC"
            ROOT="$(dirname "$PUBSPEC")"
          fi

          cp -a "$ROOT"/. ./

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f signing/app_build.gradle
          test -f signing/key.properties
          test -f signing/sheti-release.jks

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Fix image dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          # Remove old dependency_overrides block.
          s = re.sub(
              r"(?ms)^dependency_overrides\s*:\s*\n.*?(?=^[A-Za-z_][A-Za-z0-9_]*\s*:|\Z)",
              "",
              s
          ).rstrip()

          s += "\n\ndependency_overrides:\n"
          s += "  image: 4.9.1\n"

          p.write_text(s)
          print("Configured image dependency override.")
          PY

          rm -f pubspec.lock
          flutter pub get

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          flutter create \
            --platforms=android \
            --project-name sheti_app \
            --org com.example .

      - name: Configure signing and JVM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/signing

          cp signing/key.properties \
            android/signing/key.properties

          cp signing/sheti-release.jks \
            android/signing/sheti-release.jks

          cp signing/app_build.gradle \
            android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if 'id "dev.flutter.flutter-gradle-plugin"' not in s:
              marker = 'id "org.jetbrains.kotlin.android"'
              if marker not in s:
                  raise SystemExit(
                      "Kotlin plugin marker not found"
                  )
              s = s.replace(
                  marker,
                  marker + '\n    id "dev.flutter.flutter-gradle-plugin"',
                  1
              )

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          if re.search(r'\bcompileOptions\s*\{', s):
              m = re.search(
                  r'\bcompileOptions\s*\{[^}]*\}',
                  s,
                  re.S
              )
              block = m.group(0)

              for key in (
                  "sourceCompatibility",
                  "targetCompatibility"
              ):
                  line = (
                      f"{key} JavaVersion.VERSION_17"
                  )
                  if re.search(rf'\b{key}\b', block):
                      block = re.sub(
                          rf'\b{key}\s+[^;\n]+;?',
                          line,
                          block
                      )
                  else:
                      block = block[:-1] + "\n        " + line + "\n    }"

              s = s[:m.start()] + block + s[m.end():]
          else:
              s = re.sub(
                  r'\bandroid\s*\{',
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """,
                  s,
                  count=1
              )

          if re.search(r'\bkotlinOptions\s*\{', s):
              if re.search(r'\bjvmTarget\s*=', s):
                  s = re.sub(
                      r'\bjvmTarget\s*=\s*["\'][^"\']+["\']',
                      'jvmTarget = "17"',
                      s
                  )
              else:
                  s = re.sub(
                      r'\bkotlinOptions\s*\{',
                      'kotlinOptions {\n        jvmTarget = "17"',
                      s,
                      count=1
                  )
          else:
              s = re.sub(
                  r'\bandroid\s*\{',
                  """android {
              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  s,
                  count=1
              )

          if not re.search(r'\bflutter\s*\{', s):
              s += '\n\nflutter {\n    source = "../.."\n}\n'

          s += """

          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
          }

          tasks.withType(
              org.jetbrains.kotlin.gradle.tasks.KotlinCompile
          ).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

          p.write_text(s)
          print("Java/Kotlin target set to 17.")
          PY

      - name: Verify dependency resolution
        run: |
          flutter pub get
          flutter pub deps

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$(find "$SDK/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          AAPT="$(find "$SDK/build-tools" \
            -name aapt -type f | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs "$APK" \
            | tee signature-info.txt

          "$AAPT" dump badging "$APK" \
            | tee package-info.txt

          mkdir -p release

          cp "$APK" release/Sheti_V4_27_arm64.apk
          cp signature-info.txt release/
          cp package-info.txt release/

          sha256sum release/Sheti_V4_27_arm64.apk \
            > release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sheti_V4_27_APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
