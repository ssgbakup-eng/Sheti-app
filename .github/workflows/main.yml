name: Build Sheti V22 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract V22 Source
        shell: bash
        run: |
          set -e

          ZIP_FILE="Sheti_V4_22.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Sheti_V4_22.zip not found in repository root"
            ls -la
            exit 1
          fi

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          echo "Checking extracted files:"
          find source -maxdepth 4 -type f | head -100

          PUBSPEC="$(find source -type f -name pubspec.yaml -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP"
            echo "ZIP contents:"
            unzip -l "$ZIP_FILE" | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found: $PROJECT_DIR"

      - name: Check Flutter Project
        run: |
          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -d lib

          flutter --version
          grep -n 'version:' pubspec.yaml || true

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi

          test -f android/app/build.gradle || \
          test -f android/app/build.gradle.kts

      - name: Check Signing Files
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f signing/key.properties ]; then
            echo "ERROR: signing/key.properties missing"
            exit 1
          fi

          if [ ! -f signing/sheti-release.jks ]; then
            echo "ERROR: signing/sheti-release.jks missing"
            exit 1
          fi

          echo "Signing files found"

      - name: Get Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Verify Android Package
        run: |
          cd "$PROJECT_DIR"

          grep -R -n 'com.example.sheti_app' \
            android/app 2>/dev/null || true

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --split-per-abi

      - name: Verify APK
        run: |
          cd "$PROJECT_DIR"

          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: ARM64 APK not found"
            find build/app/outputs -type f || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload V22 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V22-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
