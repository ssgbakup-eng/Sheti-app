
name: Build Sheti App V27 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V27 Source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Sheti_V4_27.zip
          mkdir -p source
          unzip -q Sheti_V4_27.zip -d source

          if [ -f source/pubspec.yaml ]; then
            cp -a source/. ./
          elif [ -f source/sheti_v25_work/pubspec.yaml ]; then
            cp -a source/sheti_v25_work/. ./
          else
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          test -f lib/main.dart
          test -f signing/app_build.gradle
          test -f signing/sheti-release.jks
          test -f signing/key.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name sheti_app \
            --org com.example .

      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/signing
          cp signing/key.properties android/signing/key.properties
          cp signing/sheti-release.jks android/signing/sheti-release.jks
          cp signing/app_build.gradle android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = 'id "org.jetbrains.kotlin.android"'
          plugin = 'id "dev.flutter.flutter-gradle-plugin"'

          if plugin not in s:
              if marker not in s:
                  raise SystemExit("Kotlin plugin marker not found")
              s = s.replace(marker, marker + "\n    " + plugin, 1)

          if "flutter {" not in s:
              s += '\n\nflutter {\n    source = "../.."\n}\n'

          p.write_text(s)
          PY

          grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/Sheti_V4_27_arm64.apk
          sha256sum release/Sheti_V4_27_arm64.apk \
            > release/SHA256SUMS.txt

      - name: Upload V27 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti_V4_27_APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
