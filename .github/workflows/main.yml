
name: Sheti App V25 APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Extract V25 Source
        shell: bash
        run: |
          test -f Sheti_V4_25.zip
          mkdir app
          unzip -q Sheti_V4_25.zip -d app

          test -f app/pubspec.yaml
          test -f app/lib/main.dart
          test -f app/signing/key.properties
          test -f app/signing/sheti-release.jks

      - name: Create Android Project
        working-directory: app
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            .

      - name: Configure Dependencies
        working-directory: app
        run: |
          cat >> pubspec.yaml <<'EOF'

          dependency_overrides:
            image: 4.3.0
            archive: 3.6.1
          EOF

      - name: Configure Android Signing
        working-directory: app
        shell: bash
        run: |
          mkdir -p android/signing

          cp signing/key.properties \
            android/signing/key.properties

          cp signing/sheti-release.jks \
            android/signing/sheti-release.jks

          cat > android/app/build.gradle <<'GRADLE'
          import java.util.Properties

          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'dev.flutter.flutter-gradle-plugin'
          }

          def signingProperties = new Properties()
          def signingFile = rootProject.file("signing/key.properties")

          if (!signingFile.exists()) {
              throw new GradleException("Signing properties missing")
          }

          signingFile.withInputStream {
              signingProperties.load(it)
          }

          android {
              namespace "com.example.sheti_app"
              compileSdk 35

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.example.sheti_app"
                  minSdk 23
                  targetSdk 35
                  versionCode 25
                  versionName "4.3.0"
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file(
                          signingProperties.getProperty("storeFile")
                      )
                      storePassword signingProperties.getProperty("storePassword")
                      keyAlias signingProperties.getProperty("keyAlias")
                      keyPassword signingProperties.getProperty("keyPassword")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source "../.."
          }
          GRADLE

          rm -f android/app/build.gradle.kts

      - name: Get Dependencies
        working-directory: app
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi

      - name: Verify APK
        run: |
          test -f app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            release/Sheti_V4_25_ARM64.apk

      - name: Upload V25 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V25-APK
          path: release/Sheti_V4_25_ARM64.apk
          if-no-files-found: error
          retention-days: 14
