
name: Build Sheti App V27

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Locate V27 Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Sheti_V4_27_JVM_FIXED.zip"

          if [ ! -f pubspec.yaml ] && [ -f "$ZIP_FILE" ]; then
            mkdir -p /tmp/sheti_v27_source
            unzip -q "$ZIP_FILE" -d /tmp/sheti_v27_source

            PUBSPEC="$(find /tmp/sheti_v27_source -name pubspec.yaml -type f -print -quit)"
            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: ZIP मध्ये pubspec.yaml सापडली नाही."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
            cp -a "$PROJECT_DIR"/. .

            if [ -d /tmp/sheti_v27_source/signing ] && [ ! -d signing ]; then
              cp -a /tmp/sheti_v27_source/signing ./signing
            fi
          fi

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Flutter project सापडला नाही."
            exit 1
          fi

          echo "Flutter project found."
          ls -la

      - name: Prepare Android Project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f android/app/build.gradle ] || \
             [ -f android/app/build.gradle.kts ]; then
            echo "Android Gradle file already exists."
            exit 0
          fi

          echo "Android Gradle file missing. Preparing Android scaffold."

          GRADLE_SOURCE=""
          if [ -f signing/app_build.gradle ]; then
            GRADLE_SOURCE="signing/app_build.gradle"
          elif [ -f app_build.gradle ]; then
            GRADLE_SOURCE="app_build.gradle"
          fi

          if [ -z "$GRADLE_SOURCE" ]; then
            echo "ERROR: Android Gradle file आणि signing/app_build.gradle दोन्ही नाहीत."
            echo "V25 शी package ID जुळवण्यासाठी मूळ signing Gradle file आवश्यक आहे."
            exit 1
          fi

          APP_ID="$(grep -E 'applicationId[[:space:]]+' "$GRADLE_SOURCE" \
            | head -n 1 \
            | sed -E "s/.*applicationId[[:space:]]+['\"]([^'\"]+)['\"].*/\1/" \
            || true)"

          if [ -z "$APP_ID" ] || [ "$APP_ID" = "$GRADLE_SOURCE" ]; then
            APP_ID="$(grep -E 'applicationId[[:space:]]*=' "$GRADLE_SOURCE" \
              | head -n 1 \
              | sed -E "s/.*applicationId[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/" \
              || true)"
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: Original applicationId शोधता आला नाही."
            exit 1
          fi

          ORG="${APP_ID%.*}"
          PROJECT_NAME="$(basename "$PWD" | tr -cd '[:alnum:]_')"
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="sheti_app"
          fi

          echo "Using original applicationId: $APP_ID"
          flutter create \
            --platforms=android \
            --org "$ORG" \
            --project-name "$PROJECT_NAME" \
            .

          test -f android/app/build.gradle || \
            test -f android/app/build.gradle.kts

      - name: Configure Release Signing Files
        shell: bash
        run: |
          set -euo pipefail

          if [ -f signing/app_build.gradle ]; then
            cp signing/app_build.gradle android/app/build.gradle
          fi

          if [ -f signing/key.properties ]; then
            cp signing/key.properties android/key.properties
          fi

          if [ -f signing/sheti-release.jks ]; then
            mkdir -p android/app
            cp signing/sheti-release.jks android/app/sheti-release.jks
          fi

          echo "Signing configuration copied when available."

      - name: Fix Image and Archive Dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          pattern = (
              r"(?ms)^dependency_overrides\s*:\s*\n"
              r"(.*?)(?=^[A-Za-z_][A-Za-z0-9_]*\s*:|\Z)"
          )
          m = re.search(pattern, s)

          if m:
              body = re.sub(
                  r"(?m)^[ \t]*(image|archive)\s*:[^\n]*(?:\n|$)",
                  "",
                  m.group(1)
              )
              replacement = (
                  "dependency_overrides:\n" + body
                  if body.strip() else ""
              )
              s = s[:m.start()] + replacement + s[m.end():]

          s = s.rstrip()

          if re.search(r"(?m)^dependency_overrides\s*:", s):
              s = re.sub(
                  r"(?m)^dependency_overrides\s*:\s*$",
                  "dependency_overrides:\n"
                  "  image: 4.11.1\n"
                  "  archive: ^4.4.0",
                  s,
                  count=1
              )
          else:
              s += (
                  "\n\ndependency_overrides:\n"
                  "  image: 4.11.1\n"
                  "  archive: ^4.4.0\n"
              )

          p.write_text(s)
          PY

          rm -f pubspec.lock
          flutter pub get

      - name: Configure Java and Kotlin 17
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: android/app/build.gradle not found after signing setup."
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          java_block = """compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""

          if re.search(r"(?s)compileOptions\s*\{.*?\}", s):
              s = re.sub(
                  r"(?s)compileOptions\s*\{.*?\}",
                  java_block, s, count=1
              )
          else:
              s = re.sub(
                  r"\bandroid\s*\{",
                  "android {\n    " + java_block,
                  s, count=1
              )

          kotlin_block = """kotlinOptions {
                  jvmTarget = '17'
              }"""

          if re.search(r"(?s)kotlinOptions\s*\{.*?\}", s):
              s = re.sub(
                  r"(?s)kotlinOptions\s*\{.*?\}",
                  kotlin_block, s, count=1
              )
          else:
              s = re.sub(
                  r"\bandroid\s*\{",
                  "android {\n    " + kotlin_block,
                  s, count=1
              )

          p.write_text(s)
          PY

      - name: Configure Audio Permission
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ] && \
             ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            sed -i \
              '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
              "$MANIFEST"
          fi

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner सापडला नाही."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-App-V27-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
