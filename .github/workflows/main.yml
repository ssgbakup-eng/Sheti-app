name: Build Sheti V17 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract Sheti V17
        run: |
          rm -rf source
          mkdir source
          unzip -q Sheti_V4_17.zip -d source

          PROJECT_DIR=$(dirname "$(find source -name pubspec.yaml -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          rm -rf android

          flutter create . --platforms=android

          mkdir -p android/signing

          cp signing/sheti-release.jks \
             android/signing/sheti-release.jks

          cp signing/key.properties \
             android/signing/key.properties

          echo "Android project created successfully."

      - name: Configure Release Signing
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")

          if not gradle.exists():
              gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise SystemExit("Android app Gradle file not found")

          s = gradle.read_text()

          # Add signing properties
          if "signing/key.properties" not in s:
              header = '''
          import java.util.Properties

          val signingProperties = Properties()
          val signingPropertiesFile = rootProject.file("signing/key.properties")

          if (signingPropertiesFile.exists()) {
              signingPropertiesFile.inputStream().use {
                  signingProperties.load(it)
              }
          }

          '''
              s = header + s

          # Kotlin DSL
          if gradle.name == "build.gradle.kts":
              if "signingConfigs" not in s:
                  s = s.replace(
                      "android {",
                      '''android {
              signingConfigs {
                  create("release") {
                      if (signingPropertiesFile.exists()) {
                          storeFile = rootProject.file(signingProperties["storeFile"] as String)
                          storePassword = signingProperties["storePassword"] as String
                          keyAlias = signingProperties["keyAlias"] as String
                          keyPassword = signingProperties["keyPassword"] as String
                      }
                  }
              }
          ''',
                      1
                  )

              s = s.replace(
                  "signingConfig = signingConfigs.getByName(\"debug\")",
                  "signingConfig = signingConfigs.getByName(\"release\")"
              )

              if "signingConfig = signingConfigs.getByName(\"release\")" not in s:
                  s = s.replace(
                      "buildTypes {",
                      '''buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
          ''',
                      1
                  )

          # Groovy DSL
          else:
              if "signingConfigs" not in s:
                  s = s.replace(
                      "android {",
                      '''android {
              signingConfigs {
                  release {
                      if (signingPropertiesFile.exists()) {
                          storeFile rootProject.file(signingProperties['storeFile'])
                          storePassword signingProperties['storePassword']
                          keyAlias signingProperties['keyAlias']
                          keyPassword signingProperties['keyPassword']
                      }
                  }
              }
          ''',
                      1
                  )

              if "signingConfig signingConfigs.release" not in s:
                  s = s.replace(
                      "buildTypes {",
                      '''buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
          ''',
                      1
                  )

          gradle.write_text(s)

          print("Configured:", gradle)
          PY

      - name: Set Version 17
        run: |
          cd "$PROJECT_DIR"

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/versionCode = .*/versionCode = 17/' android/app/build.gradle.kts
            sed -i 's/versionName = .*/versionName = "4.1.3"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/versionCode .*/versionCode 17/' android/app/build.gradle
            sed -i 's/versionName .*/versionName "4.1.3"/' android/app/build.gradle
          fi

      - name: Verify Configuration
        run: |
          cd "$PROJECT_DIR"

          test -f android/signing/sheti-release.jks
          test -f android/signing/key.properties

          echo "Signing files:"
          ls -lh android/signing/

          echo "Android Gradle files:"
          ls -lh android/app/

          echo "Configuration check PASSED."

      - name: Build Samsung S24 ARM64 APK
        run: |
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --split-per-abi

      - name: Verify APK
        run: |
          cd "$PROJECT_DIR"

          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          test -f "$APK"

          echo "V17 APK created successfully:"
          ls -lh "$APK"

      - name: Upload Sheti V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V17-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
