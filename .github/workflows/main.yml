
name: Sheti App V25 APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check V25 ZIP
        run: |
          test -f Sheti_V4_25.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Extract V25 Source
        run: |
          mkdir -p source
          unzip -q Sheti_V4_25.zip -d source

          test -f source/pubspec.yaml
          test -f source/lib/main.dart
          test -f source/signing/app_build.gradle
          test -f source/signing/key.properties
          test -f source/signing/sheti-release.jks

      - name: Create Flutter Project
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name sheti_app \
            project

          cp source/pubspec.yaml project/pubspec.yaml

          rm -rf project/lib
          cp -r source/lib project/lib

          if [ -d source/assets ]; then
            mkdir -p project/assets
            cp -r source/assets/. project/assets/
          fi

      - name: Configure Android Signing
        shell: bash
        run: |
          mkdir -p project/android/signing

          cp source/signing/key.properties \
            project/android/signing/key.properties

          cp source/signing/sheti-release.jks \
            project/android/signing/sheti-release.jks

          cat > project/android/app/build.gradle <<'GRADLE'
          import java.util.Properties

          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'dev.flutter.flutter-gradle-plugin'
          }

          def signingProperties = new Properties()
          def signingFile = rootProject.file("signing/key.properties")

          if (!signingFile.exists()) {
              throw new GradleException("Signing properties missing")
          }

          signingFile.withInputStream {
              signingProperties.load(it)
          }

          android {
              namespace "com.example.sheti_app"
              compileSdk 35

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.example.sheti_app"
                  minSdk 23
                  targetSdk 35
                  versionCode 25
                  versionName "4.3.0"
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file(
                          signingProperties.getProperty("storeFile")
                      )
                      storePassword signingProperties.getProperty("storePassword")
                      keyAlias signingProperties.getProperty("keyAlias")
                      keyPassword signingProperties.getProperty("keyPassword")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source "../.."
          }
          GRADLE

          rm -f project/android/app/build.gradle.kts

          test -f project/android/app/build.gradle
          test -f project/android/signing/key.properties
          test -f project/android/signing/sheti-release.jks

      - name: Get Dependencies
        working-directory: project
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        working-directory: project
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f project/build/app/outputs/flutter-apk/app-release.apk

          mkdir -p release
          cp project/build/app/outputs/flutter-apk/app-release.apk \
            release/Sheti_V4_25.apk

      - name: Upload V25 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V25-APK
          path: release/Sheti_V4_25.apk
          if-no-files-found: error
          retention-days: 14
