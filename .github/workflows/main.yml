name: Build Sheti V22 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract V22 Source
        run: |
          mkdir -p source
          unzip -q Sheti_V4_22.zip -d source

          PROJECT_DIR="$(dirname "$(find source -name pubspec.yaml -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "source" ]; then
            echo "ERROR: Flutter project pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          flutter create . --platforms=android

      - name: Configure Release Signing
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f signing/key.properties ] || \
             [ ! -f signing/sheti-release.jks ]; then
            echo "ERROR: Existing release signing files are missing"
            exit 1
          fi

          mkdir -p android/signing
          cp signing/key.properties android/signing/key.properties
          cp signing/sheti-release.jks android/signing/sheti-release.jks

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if 'applicationId "com.example.sheti_app"' not in s:
              raise SystemExit("ERROR: Unexpected applicationId")

          s = s.replace('versionCode flutterVersionCode.toInteger()', 'versionCode 22')
          s = s.replace('versionName flutterVersionName', 'versionName "4.1.8"')

          if 'versionCode 22' not in s:
              raise SystemExit("ERROR: Could not set versionCode 22")

          p.write_text(s)
          PY

      - name: Check Version and Signing
        run: |
          cd "$PROJECT_DIR"
          grep -n 'applicationId' android/app/build.gradle
          grep -n 'versionCode' android/app/build.gradle
          grep -n 'versionName' android/app/build.gradle
          test -f android/signing/key.properties
          test -f android/signing/sheti-release.jks

      - name: Get Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release --split-per-abi

      - name: Verify APK
        run: |
          cd "$PROJECT_DIR"
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload V22 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V22-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
