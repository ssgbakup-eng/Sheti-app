name: Sheti App - V25 Base V27

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Flutter
      - name: Setup Flutter 3.35.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.2
          channel: stable
          cache: true

      # 3. Find V25 ZIP
      - name: Extract V25 Base
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "Sheti_V4_25.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Sheti_V4_25.zip not found"
            exit 1
          fi

          rm -rf sheti_v25
          mkdir -p sheti_v25

          unzip -q "$ZIP" -d sheti_v25

          PROJECT=$(find sheti_v25 \
            -type f \
            -name "pubspec.yaml" \
            -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: V25 pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "========================================"
          echo "V25 BASE FOUND"
          echo "PROJECT: $PROJECT"
          echo "========================================"

      # 4. Read V25 Application ID
      - name: Read V25 Application ID
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT/signing/app_build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: signing/app_build.gradle not found"
            exit 1
          fi

          APP_ID=$(grep -oE \
            'applicationId[[:space:]]*(=)?[[:space:]]*["'\''][^"'\'']+["'\'']' \
            "$APP_GRADLE" \
            | head -1 \
            | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')

          if [ -z "$APP_ID" ]; then
            echo "ERROR: V25 Application ID not found"
            exit 1
          fi

          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

          echo "V25 APPLICATION ID = $APP_ID"

      # 5. Create Android project
      - name: Create Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          rm -rf android

          flutter create \
            --no-pub \
            --platforms=android \
            --project-name sheti_app \
            --org com.sheti \
            .

          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not created"
            exit 1
          fi

          echo "Android project created successfully"

      # 6. Detect Gradle file
      - name: Detect Android Gradle File
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT/android/app/build.gradle.kts" ]; then
            echo "GRADLE_FILE=android/app/build.gradle.kts" >> "$GITHUB_ENV"
            echo "GRADLE_TYPE=KTS" >> "$GITHUB_ENV"
            echo "Detected: build.gradle.kts"

          elif [ -f "$PROJECT/android/app/build.gradle" ]; then
            echo "GRADLE_FILE=android/app/build.gradle" >> "$GITHUB_ENV"
            echo "GRADLE_TYPE=GROOVY" >> "$GITHUB_ENV"
            echo "Detected: build.gradle"

          else
            echo "ERROR: Android app Gradle file not found"
            exit 1
          fi

      # 7. Restore V25 signing
      - name: Restore V25 Signing
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          if [ ! -f "signing/key.properties" ]; then
            echo "ERROR: V25 key.properties not found"
            exit 1
          fi

          if [ ! -f "signing/sheti-release.jks" ]; then
            echo "ERROR: V25 sheti-release.jks not found"
            exit 1
          fi

          mkdir -p android/signing

          cp -f signing/key.properties \
            android/signing/key.properties

          cp -f signing/sheti-release.jks \
            android/signing/sheti-release.jks

          echo "V25 signing restored"

      # 8. Configure Android App
      - name: Configure Android App
        shell: bash
        env:
          V25_APP_ID: ${{ env.APP_ID }}
          V25_GRADLE_FILE: ${{ env.GRADLE_FILE }}
          V25_GRADLE_TYPE: ${{ env.GRADLE_TYPE }}
        run: |
          set -e

          cd "$PROJECT"

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          app_id = os.environ["V25_APP_ID"]
          gradle_file = Path(os.environ["V25_GRADLE_FILE"])
          gradle_type = os.environ["V25_GRADLE_TYPE"]

          text = gradle_file.read_text()

          # ----------------------------------------
          # Application ID
          # ----------------------------------------
          if gradle_type == "KTS":
              text, n = re.subn(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{app_id}"',
                  text,
                  count=1
              )
          else:
              text, n = re.subn(
                  r'applicationId\s+["\'][^"\']+["\']',
                  f'applicationId "{app_id}"',
                  text,
                  count=1
              )

          if n == 0:
              raise SystemExit("ERROR: applicationId not found")

          # ----------------------------------------
          # Version Code
          # ----------------------------------------
          if gradle_type == "KTS":
              text = re.sub(
                  r'versionCode\s*=\s*[^\n]+',
                  'versionCode = 27',
                  text,
                  count=1
              )
          else:
              text = re.sub(
                  r'versionCode\s+[^\n]+',
                  'versionCode 27',
                  text,
                  count=1
              )

          # ----------------------------------------
          # Version Name
          # ----------------------------------------
          if gradle_type == "KTS":
              text = re.sub(
                  r'versionName\s*=\s*[^\n]+',
                  'versionName = "4.27.0"',
                  text,
                  count=1
              )
          else:
              text = re.sub(
                  r'versionName\s+[^\n]+',
                  'versionName "4.27.0"',
                  text,
                  count=1
              )

          # ----------------------------------------
          # V25 Signing
          # ----------------------------------------
          if gradle_type == "KTS":

              if 'import java.util.Properties' not in text:
                  text = (
                      'import java.util.Properties\n'
                      'import java.io.FileInputStream\n\n'
                      + text
                  )

              signing_block = r'''
    signingConfigs {
        create("release") {
            val keystoreProperties = Properties()
            val keystorePropertiesFile =
                rootProject.file("signing/key.properties")

            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(
                    FileInputStream(keystorePropertiesFile)
                )

                storeFile =
                    rootProject.file(
                        "signing/sheti-release.jks"
                    )

                storePassword =
                    keystoreProperties["storePassword"] as String

                keyAlias =
                    keystoreProperties["keyAlias"] as String

                keyPassword =
                    keystoreProperties["keyPassword"] as String
            }
        }
    }

'''

              if 'create("release")' not in text:
                  marker = '    buildTypes {'

                  if marker not in text:
                      raise SystemExit(
                          "ERROR: buildTypes block not found"
                      )

                  text = text.replace(
                      marker,
                      signing_block + marker,
                      1
                  )

              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")'
              )

          else:

              signing_block = r'''
    signingConfigs {
        release {
            def kp = new Properties()
            def kpFile = rootProject.file("signing/key.properties")

            if (kpFile.exists()) {
                kp.load(new FileInputStream(kpFile))

                storeFile =
                    rootProject.file("signing/sheti-release.jks")

                storePassword = kp["storePassword"]
                keyAlias = kp["keyAlias"]
                keyPassword = kp["keyPassword"]
            }
        }
    }

'''

              if "signingConfigs {" not in text:
                  marker = "    buildTypes {"

                  if marker not in text:
                      raise SystemExit(
                          "ERROR: buildTypes block not found"
                      )

                  text = text.replace(
                      marker,
                      signing_block + marker,
                      1
                  )

              text = text.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release"
              )

          gradle_file.write_text(text)

          print("")
          print("========================================")
          print("ANDROID CONFIGURATION COMPLETE")
          print("Application ID :", app_id)
          print("Version Code   : 27")
          print("Version Name   : 4.27.0")
          print("Signing        : V25")
          print("Gradle Type    :", gradle_type)
          print("========================================")
          PY

      # 9. Dependency configuration
      - name: Configure Dependencies
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text()

          text = re.sub(
              r'\ndependency_overrides:\n(?:^[ \t]+.*\n?)*',
              '\n',
              text,
              flags=re.MULTILINE
          )

          text = text.rstrip() + """

          dependency_overrides:
            image: 4.11.1
          """

          path.write_text(text)
          PY

          rm -f pubspec.lock

      # 10. Flutter Pub Get
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          flutter clean
          flutter pub get

      # 11. Final Configuration Check
      - name: Final Configuration Check
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo ""
          echo "========================================"
          echo "FINAL SHETI CONFIGURATION"
          echo "========================================"

          if [ -f android/app/build.gradle.kts ]; then
            grep -E \
              "applicationId|versionCode|versionName" \
              android/app/build.gradle.kts
          else
            grep -E \
              "applicationId|versionCode|versionName" \
              android/app/build.gradle
          fi

          echo ""
          echo "BASE       : V25"
          echo "BUILD      : V27"
          echo "SIGNING    : V25"
          echo "ARCH       : ARM64"
          echo "========================================"

      # 12. Build APK
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          flutter build apk \
            --release \
            --target-platform android-arm64

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo ""
          echo "APK CREATED"
          ls -lh "$APK"

      # 13. Verify APK package
      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt \
            | sort -V \
            | tail -1)

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found"
            exit 1
          fi

          PACKAGE=$(
            "$AAPT" dump badging "$APK" \
            | sed -n "s/package: name='\([^']*\)'.*/\1/p" \
            | head -1
          )

          echo "APK PACKAGE = $PACKAGE"
          echo "V25 APP ID  = ${APP_ID}"

          if [ "$PACKAGE" != "${APP_ID}" ]; then
            echo "ERROR: APK PACKAGE DOES NOT MATCH V25 APP ID"
            exit 1
          fi

          echo "APK PACKAGE CHECK = OK"

      # 14. Verify APK Signature
      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -1)

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK SIGNATURE = OK"

      # 15. Compare V25 Certificate
      - name: Verify V25 Certificate
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK="build/app/outputs/flutter-apk/app-release.apk"
          JKS="android/signing/sheti-release.jks"
          KP="android/signing/key.properties"

          test -f "$JKS"
          test -f "$KP"

          STORE_PASSWORD=$(
            grep '^storePassword=' "$KP" \
            | head -1 \
            | cut -d'=' -f2-
          )

          KEY_ALIAS=$(
            grep '^keyAlias=' "$KP" \
            | head -1 \
            | cut -d'=' -f2-
          )

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: storePassword not found"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: keyAlias not found"
            exit 1
          fi

          JKS_CERT=$(
            keytool -list -v \
              -keystore "$JKS" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -i "SHA256:" \
            | head -1 \
            | sed 's/.*SHA256:[[:space:]]*//'
          )

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -1)

          APK_CERT=$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK" 2>/dev/null \
            | grep -i \
              "Signer #1 certificate SHA-256 digest:" \
            | sed 's/.*digest:[[:space:]]*//'
          )

          JKS_CERT=$(echo "$JKS_CERT" \
            | tr -d ' ' \
            | tr '[:lower:]' '[:upper:]')

          APK_CERT=$(echo "$APK_CERT" \
            | tr -d ' ' \
            | tr '[:lower:]' '[:upper:]')

          if [ -z "$JKS_CERT" ] || [ -z "$APK_CERT" ]; then
            echo "ERROR: Certificate fingerprint not available"
            exit 1
          fi

          if [ "$JKS_CERT" != "$APK_CERT" ]; then
            echo "ERROR: V25 CERTIFICATE MISMATCH"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "V25 CERTIFICATE = MATCH"
          echo "========================================"

      # 16. Prepare verified APK
      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          cp \
            "$PROJECT/build/app/outputs/flutter-apk/app-release.apk" \
            "$GITHUB_WORKSPACE/Sheti_V27_arm64.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/Sheti_V27_arm64.apk"

      # 17. Build information
      - name: Create Build Information
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/Sheti_V27_Build_Info.txt" <<EOF
          SHETI APP V27

          BASE:
          Sheti_V4_25.zip

          APPLICATION ID:
          ${APP_ID}

          VERSION CODE:
          27

          VERSION NAME:
          4.27.0

          SIGNING:
          V25 sheti-release.jks

          ARCHITECTURE:
          ARM64

          VERIFIED:
          APK Package = OK
          APK Signature = OK
          V25 Certificate = MATCH

          APK:
          Sheti_V27_arm64.apk
          EOF

      # 18. Upload only verified APK
      - name: Upload Verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V27-APK
          path: |
            Sheti_V27_arm64.apk
            Sheti_V27_Build_Info.txt
