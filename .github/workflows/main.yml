name: Build Sheti V21 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract Sheti V21
        run: |
          rm -rf source
          mkdir source
          unzip -q Sheti_V4_21.zip -d source

          PROJECT_DIR=$(dirname "$(find source -name pubspec.yaml -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          rm -rf android
          flutter create . --platforms=android

          mkdir -p android/signing

          cp signing/sheti-release.jks \
            android/signing/sheti-release.jks

          cp signing/key.properties \
            android/signing/key.properties

      - name: Configure Release Signing
        run: |
          cd "$PROJECT_DIR"

          cat > android/app/build.gradle <<'GRADLE'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          import java.util.Properties

          def signingProperties = new Properties()
          def signingFile = rootProject.file("signing/key.properties")

          if (signingFile.exists()) {
              signingFile.withInputStream {
                  signingProperties.load(it)
              }
          }

          android {
              namespace "com.example.sheti_app"
              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.example.sheti_app"
                  minSdk 23
                  targetSdk flutter.targetSdkVersion
                  versionCode 21
                  versionName "4.1.7"
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file(
                          signingProperties["storeFile"]
                      )
                      storePassword signingProperties["storePassword"]
                      keyAlias signingProperties["keyAlias"]
                      keyPassword signingProperties["keyPassword"]
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source "../.."
          }
          GRADLE

      - name: Verify Configuration
        run: |
          cd "$PROJECT_DIR"

          grep 'applicationId' android/app/build.gradle
          grep 'versionCode' android/app/build.gradle
          grep 'versionName' android/app/build.gradle

          test -f android/signing/sheti-release.jks
          test -f android/signing/key.properties

          echo "Configuration checks passed"

      - name: Build Samsung S24 ARM64 APK
        run: |
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --split-per-abi

      - name: Verify V21 APK
        run: |
          cd "$PROJECT_DIR"

          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: ARM64 APK NOT FOUND"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload V21 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V21-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
