
name: Sheti App V25 APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check V25 ZIP
        shell: bash
        run: |
          test -f Sheti_V4_25.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Extract V25 Source
        shell: bash
        run: |
          mkdir -p source
          unzip -q Sheti_V4_25.zip -d source

          test -f source/pubspec.yaml
          test -f source/lib/main.dart
          test -f source/signing/key.properties
          test -f source/signing/sheti-release.jks

      - name: Create Flutter Project
        shell: bash
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name sheti_app \
            project

          cp source/pubspec.yaml project/pubspec.yaml

          rm -rf project/lib
          cp -r source/lib project/lib

          if [ -d source/assets ]; then
            mkdir -p project/assets
            cp -r source/assets/. project/assets/
          fi

      - name: Configure Android Signing
        shell: bash
        run: |
          mkdir -p project/android/signing

          cp source/signing/key.properties \
            project/android/signing/key.properties

          cp source/signing/sheti-release.jks \
            project/android/signing/sheti-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("project/android/app/build.gradle.kts")
          s = p.read_text()

          if "dev.flutter.flutter-gradle-plugin" not in s:
              raise SystemExit("Flutter Gradle plugin missing")

          # Import must be at the top of the Kotlin Gradle file.
          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\n" + s

          s = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.example.sheti_app"',
              s
          )

          s = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.example.sheti_app"',
              s
          )

          s = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 25',
              s
          )

          s = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "4.3.0"',
              s
          )

          # Add signing properties before the android block.
          if "val signingProperties = Properties()" not in s:
              signing = '''
          val signingProperties = Properties()
          val signingFile = rootProject.file("signing/key.properties")

          if (!signingFile.exists()) {
              throw GradleException("Signing properties missing")
          }

          signingFile.inputStream().use {
              signingProperties.load(it)
          }

          '''
              s = re.sub(
                  r'(?m)^android\s*\{',
                  lambda m: signing + m.group(0),
                  s,
                  count=1
              )

          # Add release signing configuration inside android.
          if 'create("release")' not in s:
              signing_config = '''
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(
                          signingProperties.getProperty("storeFile")
                      )
                      storePassword =
                          signingProperties.getProperty("storePassword")
                      keyAlias =
                          signingProperties.getProperty("keyAlias")
                      keyPassword =
                          signingProperties.getProperty("keyPassword")
                  }
              }

          '''
              s, count = re.subn(
                  r'(?m)^(\s*)buildTypes\s*\{',
                  lambda m: signing_config + m.group(0),
                  s,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not configure release signing")

          # Use the release key for release builds.
          s = re.sub(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("release")',
              s
          )

          release_block = re.search(
              r'getByName\("release"\)\s*\{',
              s
          )

          if release_block:
              start = release_block.end()
              remainder = s[start:start + 500]
              if 'signingConfig = signingConfigs.getByName("release")' not in remainder:
                  s = (
                      s[:start]
                      + '\n            signingConfig = signingConfigs.getByName("release")'
                      + s[start:]
                  )
          else:
              raise SystemExit("Release build type missing")

          p.write_text(s)
          print("Android signing configuration updated.")
          PY

          test -f project/android/app/build.gradle.kts

      - name: Get Dependencies
        working-directory: project
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        working-directory: project
        run: |
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -f project/build/app/outputs/flutter-apk/app-release.apk

          mkdir -p release
          cp project/build/app/outputs/flutter-apk/app-release.apk \
            release/Sheti_V4_25.apk

      - name: Upload V25 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V25-APK
          path: release/Sheti_V4_25.apk
          if-no-files-found: error
          retention-days: 14
