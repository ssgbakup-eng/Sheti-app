
name: Build Sheti V26 Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Sheti_V4_26.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Extract V26 Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Sheti_V4_26.zip"
          test -f "$ZIP_FILE" || {
            echo "ERROR: V26 ZIP not found"
            exit 1
          }

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_DIR="source"

          test -s "$PROJECT_DIR/pubspec.yaml"
          test -s "$PROJECT_DIR/lib/main.dart"
          test -s "$PROJECT_DIR/signing/key.properties"
          test -s "$PROJECT_DIR/signing/sheti-release.jks"
          test -s "$PROJECT_DIR/signing/app_build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "V26 source and signing files verified."

      - name: Set V26 Version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text(encoding="utf-8")
          s, count = re.subn(
              r"(?m)^version\s*:.*$",
              "version: 4.4.0+26",
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("ERROR: pubspec version field missing")
          p.write_text(s, encoding="utf-8")

          p = Path("signing/app_build.gradle")
          s = p.read_text(encoding="utf-8")

          s, c1 = re.subn(
              r"(?m)^(\s*versionCode\s+)\d+",
              r"\g<1>26",
              s,
              count=1
          )
          s, c2 = re.subn(
              r'(?m)^(\s*versionName\s+")[^"]*(")',
              r'\g<1>4.4.0\2',
              s,
              count=1
          )

          if c1 != 1 or c2 != 1:
              raise SystemExit(
                  "ERROR: Could not update signing/app_build.gradle version"
              )

          p.write_text(s, encoding="utf-8")
          print("V26 version set to 4.4.0+26")
          PY

      - name: Generate Android Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter create . \
            --platforms=android \
            --org com.example

          if [ ! -f android/settings.gradle ] && \
             [ ! -f android/settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file missing"
            exit 1
          fi

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android app Gradle file missing"
            exit 1
          fi

          test -s android/app/src/main/AndroidManifest.xml
          echo "Android project generated and verified."

      - name: Configure Release Signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          mkdir -p android/signing

          cp signing/key.properties \
            android/signing/key.properties

          cp signing/sheti-release.jks \
            android/signing/sheti-release.jks

          test -s android/signing/key.properties
          test -s android/signing/sheti-release.jks

          echo "Release signing files copied."

      - name: Configure Android Release Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          # Use one Groovy app Gradle file, not both DSL variants.
          rm -f android/app/build.gradle.kts

          cat > android/app/build.gradle <<'GRADLE'
          import java.util.Properties

          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def signingProperties = new Properties()
          def signingPropertiesFile =
              rootProject.file("signing/key.properties")

          if (!signingPropertiesFile.exists()) {
              throw new GradleException(
                  "Release key.properties not found"
              )
          }

          signingPropertiesFile.withInputStream {
              signingProperties.load(it)
          }

          def storeFileValue =
              signingProperties.getProperty("storeFile")

          if (!storeFileValue) {
              throw new GradleException(
                  "storeFile is missing in key.properties"
              )
          }

          def storeFileCandidate = rootProject.file(storeFileValue)

          if (!storeFileCandidate.exists()) {
              storeFileCandidate =
                  rootProject.file("signing/sheti-release.jks")
          }

          if (!storeFileCandidate.exists()) {
              throw new GradleException(
                  "Release keystore path could not be resolved"
              )
          }

          android {
              namespace "com.example.sheti_app"
              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.example.sheti_app"
                  minSdk 23
                  targetSdk flutter.targetSdkVersion
                  versionCode 26
                  versionName "4.4.0"
              }

              signingConfigs {
                  release {
                      storeFile storeFileCandidate
                      storePassword signingProperties.getProperty(
                          "storePassword"
                      )
                      keyAlias signingProperties.getProperty(
                          "keyAlias"
                      )
                      keyPassword signingProperties.getProperty(
                          "keyPassword"
                      )
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source "../.."
          }
          GRADLE

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permission = (
              '<uses-permission '
              'android:name="android.permission.RECORD_AUDIO"/>'
          )

          if "android.permission.RECORD_AUDIO" not in s:
              pos = s.find(">")
              if pos < 0:
                  raise SystemExit("ERROR: Invalid AndroidManifest.xml")
              s = s[:pos + 1] + "\n    " + permission + s[pos + 1:]
              p.write_text(s, encoding="utf-8")
          PY

          grep -q 'applicationId "com.example.sheti_app"' \
            android/app/build.gradle
          grep -q 'versionCode 26' android/app/build.gradle
          grep -q 'versionName "4.4.0"' android/app/build.gradle
          grep -q 'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "Application ID and release Gradle settings verified."

      - name: Flutter Clean and Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter --version
          flutter clean
          flutter pub get

      - name: Build V26 ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK not generated"
            find "$PROJECT_DIR/build" -type f -name "*.apk" || true
            exit 1
          fi

          mkdir -p release_apk
          cp "$APK" release_apk/Sheti_V4_26_ARM64.apk
          ls -lh release_apk/Sheti_V4_26_ARM64.apk

      - name: Upload V26 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V26-APK
          path: release_apk/Sheti_V4_26_ARM64.apk
          if-no-files-found: error
          retention-days: 30
