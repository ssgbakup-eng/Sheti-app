
name: Build Sheti V26 Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Sheti_V4_26.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract V26 Source
        shell: bash
        run: |
          set -e

          if [ ! -f Sheti_V4_26.zip ]; then
            echo "ERROR: Sheti_V4_26.zip not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q Sheti_V4_26.zip -d extracted

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -d "$dir/android" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find extracted -type f -name pubspec.yaml)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project with android folder not found"
            echo "ZIP folder structure:"
            find extracted -maxdepth 6 -type d | head -150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/android"

      - name: Verify Existing Android Project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f android/app/build.gradle.kts ]; then
            echo "Gradle file: build.gradle.kts"
          elif [ -f android/app/build.gradle ]; then
            echo "Gradle file: build.gradle"
          else
            echo "ERROR: Android app Gradle file missing"
            exit 1
          fi

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml missing"
            exit 1
          fi

          echo "Existing Android project verified."

      - name: Preserve Existing Signing Files
        shell: bash
        run: |
          set -e

          KEY_FILE="$(find extracted -type f \
            -name sheti-release.jks | head -n 1 || true)"

          PROPS_FILE="$(find extracted -type f \
            -path '*/signing/key.properties' | head -n 1 || true)"

          if [ -z "$KEY_FILE" ] || [ -z "$PROPS_FILE" ]; then
            echo "ERROR: Original signing files not found in V26 ZIP."
            echo "Cannot safely generate an update APK."
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/android/signing"

          cp "$KEY_FILE" \
            "$PROJECT_DIR/android/signing/sheti-release.jks"

          cp "$PROPS_FILE" \
            "$PROJECT_DIR/android/signing/key.properties"

          echo "Original signing files copied."

      - name: Verify Package and Signing Configuration
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          else
            GRADLE_FILE="android/app/build.gradle"
          fi

          echo "Checking: $GRADLE_FILE"

          if ! grep -q 'com.example.sheti_app' "$GRADLE_FILE"; then
            echo "ERROR: Expected application ID not found."
            echo "Expected: com.example.sheti_app"
            exit 1
          fi

          if ! grep -qi 'signingConfig' "$GRADLE_FILE"; then
            echo "ERROR: Release signing configuration not found."
            exit 1
          fi

          echo "Application ID and signing configuration checked."

      - name: Set V26 Version
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          text = p.read_text(encoding="utf-8")

          version = "version: 4.4.0+26"

          if re.search(r"(?m)^version\s*:", text):
              text = re.sub(
                  r"(?m)^version\s*:.*$",
                  version,
                  text,
                  count=1
              )
          else:
              text = version + "\n" + text

          p.write_text(text, encoding="utf-8")
          print("V26 version set: 4.4.0+26")
          PY

      - name: Flutter Clean and Dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter --version
          flutter clean
          flutter pub get

      - name: Build V26 ARM64 Release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Prepare APK Artifact
        shell: bash
        run: |
          set -e

          mkdir -p release_apk

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not generated."
            find "$PROJECT_DIR/build" -type f -name '*.apk' || true
            exit 1
          fi

          cp "$APK" release_apk/Sheti_V4_26_ARM64.apk
          ls -lh release_apk/

      - name: Upload V26 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V26-APK
          path: release_apk/Sheti_V4_26_ARM64.apk
          if-no-files-found: error
          retention-days: 30
