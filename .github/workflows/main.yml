name: Build Sheti V23 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract V23 Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Sheti_V4_23.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Sheti_V4_23.zip not found in repository root"
            ls -la
            exit 1
          fi

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PUBSPEC="$(find source -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP"
            unzip -l "$ZIP_FILE" | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -d lib
          test -f signing/key.properties
          test -f signing/sheti-release.jks

          # Create a fresh Android project without changing Dart code.
          flutter create . --platforms=android --org com.example

          mkdir -p android/signing
          cp signing/key.properties android/signing/key.properties
          cp signing/sheti-release.jks android/signing/sheti-release.jks

      - name: Configure Release Build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          cat > android/app/build.gradle <<'GRADLE'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          import java.util.Properties

          def signingProps = new Properties()
          def signingFile = rootProject.file("signing/key.properties")

          if (!signingFile.exists()) {
              throw new GradleException("Release signing properties missing")
          }

          signingFile.withInputStream {
              signingProps.load(it)
          }

          android {
              namespace "com.example.sheti_app"
              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.example.sheti_app"
                  minSdk 23
                  targetSdk flutter.targetSdkVersion
                  versionCode 23
                  versionName "4.1.9"
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file(signingProps["storeFile"])
                      storePassword signingProps["storePassword"]
                      keyAlias signingProps["keyAlias"]
                      keyPassword signingProps["keyPassword"]
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source "../.."
          }
          GRADLE

          # Validate Manifest XML without modifying it.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.parse(manifest)
          print("AndroidManifest.xml is valid XML")
          PY

      - name: Verify Package Version And Signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -F 'applicationId "com.example.sheti_app"' android/app/build.gradle
          grep -F 'versionCode 23' android/app/build.gradle
          grep -F 'versionName "4.1.9"' android/app/build.gradle

          test -f android/signing/key.properties
          test -f android/signing/sheti-release.jks

      - name: Get Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Samsung S24 APK
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          flutter build apk --release --split-per-abi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload V23 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V23-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
