name: Build Sheti APK from V25

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti APK from V25
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # V25 SOURCE
      # ==================================================
      - name: Extract V25 Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Sheti_V4_25.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          }

          rm -rf /tmp/sheti_v25
          mkdir -p /tmp/sheti_v25

          unzip -q "$ZIP_FILE" -d /tmp/sheti_v25

          PUBSPEC="$(find /tmp/sheti_v25 \
            -name pubspec.yaml \
            -type f \
            -print -quit)"

          test -n "$PUBSPEC" || {
            echo "ERROR: pubspec.yaml not found."
            exit 1
          }

          V25_DIR="$(dirname "$PUBSPEC")"

          echo "V25 source: $V25_DIR"

          cp -a "$V25_DIR"/. "$GITHUB_WORKSPACE"/

          test -f pubspec.yaml
          test -d lib
          test -d assets
          test -d signing
          test -f signing/app_build.gradle
          test -f signing/key.properties
          test -f signing/sheti-release.jks


      # ==================================================
      # READ V25 INFORMATION
      # ==================================================
      - name: Read V25 App Information
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="signing/app_build.gradle"

          PACKAGE_ID="$(
            grep -E 'applicationId[[:space:]]+' "$GRADLE" \
            | head -n 1 \
            | sed -E 's/.*applicationId[[:space:]]+"([^"]+)".*/\1/'
          )"

          VERSION_CODE="$(
            grep -E 'versionCode[[:space:]]+' "$GRADLE" \
            | head -n 1 \
            | sed -E 's/.*versionCode[[:space:]]+([0-9]+).*/\1/'
          )"

          VERSION_NAME="$(
            grep -E '^version:' pubspec.yaml \
            | head -n 1 \
            | sed 's/^version:[[:space:]]*//'
          )"

          test -n "$PACKAGE_ID" || {
            echo "ERROR: V25 Package ID not found."
            exit 1
          }

          test -n "$VERSION_CODE" || {
            echo "ERROR: V25 Version Code not found."
            exit 1
          }

          test -n "$VERSION_NAME" || {
            echo "ERROR: V25 Version not found."
            exit 1
          }

          echo "V25_PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
          echo "V25_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "V25_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "V25 APP INFORMATION"
          echo "======================================"
          echo "Package ID   : $PACKAGE_ID"
          echo "Version Code : $VERSION_CODE"
          echo "Version      : $VERSION_NAME"
          echo "======================================"


      # ==================================================
      # JAVA
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # FLUTTER
      # ==================================================
      - name: Setup Flutter 3.35.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true


      # ==================================================
      # CREATE ANDROID PROJECT IN TEMP LOCATION
      # ==================================================
      - name: Create Android Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/flutter_android_template

          mkdir -p /tmp/flutter_android_template

          flutter create \
            --platforms=android \
            --project-name sheti_app \
            --org com.example \
            /tmp/flutter_android_template

          test -d /tmp/flutter_android_template/android

          rm -rf android

          cp -a \
            /tmp/flutter_android_template/android \
            ./android

          test -f android/app/build.gradle
          test -f android/settings.gradle

          echo "Android project successfully created."


      # ==================================================
      # APPLY V25 SIGNING
      # ==================================================
      - name: Apply V25 Signing Configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/signing

          cp signing/key.properties \
            android/signing/key.properties

          cp signing/sheti-release.jks \
            android/signing/sheti-release.jks

          cp signing/app_build.gradle \
            android/app/build.gradle

          test -f android/signing/key.properties
          test -f android/signing/sheti-release.jks
          test -f android/app/build.gradle

          echo "V25 signing files applied."


      # ==================================================
      # ENSURE FLUTTER GRADLE PLUGIN
      # ==================================================
      - name: Ensure Flutter Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          plugin = 'id "dev.flutter.flutter-gradle-plugin"'

          if plugin not in s:
              if 'id "org.jetbrains.kotlin.android"' in s:
                  s = s.replace(
                      'id "org.jetbrains.kotlin.android"',
                      'id "org.jetbrains.kotlin.android"\n    ' + plugin,
                      1
                  )
              else:
                  s = s.replace(
                      'plugins {',
                      'plugins {\n    ' + plugin,
                      1
                  )

          if "flutter {" not in s:
              s += """

          flutter {
              source = "../.."
          }
          """

          p.write_text(s)
          PY


      # ==================================================
      # JAVA / KOTLIN 17
      # ==================================================
      - name: Configure Java Kotlin 17
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              s += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

          if 'jvmTarget = "17"' not in s:
              s += """

          kotlinOptions {
              jvmTarget = "17"
          }
          """

          p.write_text(s)
          PY


      # ==================================================
      # AUDIO PERMISSION
      # ==================================================
      - name: Configure Audio Permission
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i \
              '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
              "$MANIFEST"
          fi


      # ==================================================
      # VERIFY IDENTITY
      # ==================================================
      - name: Verify V25 Identity
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "======================================"
          echo "V25 IDENTITY CHECK"
          echo "======================================"
          echo "Package ID   : $V25_PACKAGE_ID"
          echo "Version Code : $V25_VERSION_CODE"
          echo "Version      : $V25_VERSION_NAME"
          echo "======================================"

          grep -q \
            "applicationId \"$V25_PACKAGE_ID\"" \
            android/app/build.gradle

          grep -q \
            "versionCode $V25_VERSION_CODE" \
            android/app/build.gradle


      # ==================================================
      # DEPENDENCIES
      # ==================================================
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get


      # ==================================================
      # BUILD
      # ==================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64


      # ==================================================
      # VERIFY APK
      # ==================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK" || {
            echo "ERROR: APK not created."
            exit 1
          }

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -name apksigner \
              -type f 2>/dev/null \
            | sort -V | tail -n 1
          )"

          AAPT="$(
            find "$SDK_ROOT/build-tools" \
              -name aapt \
              -type f 2>/dev/null \
            | sort -V | tail -n 1
          )"

          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify --verbose "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep "^package:"

          APK_PACKAGE="$(
            echo "$BADGING" \
            | sed -n "s/.*name='\([^']*\)'.*/\1/p" \
            | head -n 1
          )"

          APK_VERSION_CODE="$(
            echo "$BADGING" \
            | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" \
            | head -n 1
          )"

          APK_VERSION_NAME="$(
            echo "$BADGING" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" \
            | head -n 1
          )"

          echo ""
          echo "======================================"
          echo "FINAL APK INFORMATION"
          echo "======================================"
          echo "Package ID   : $APK_PACKAGE"
          echo "Version Code : $APK_VERSION_CODE"
          echo "Version      : $APK_VERSION_NAME"
          echo "======================================"

          if [ "$APK_PACKAGE" != "$V25_PACKAGE_ID" ]; then
            echo "ERROR: Package ID changed."
            exit 1
          fi

          if [ "$APK_VERSION_CODE" != "$V25_VERSION_CODE" ]; then
            echo "ERROR: Version Code changed."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK"


      # ==================================================
      # APP INFO
      # ==================================================
      - name: Create App Info
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cat > release/APP_INFO.txt <<EOF
          SHETI APP V25 BASE

          Package ID   : $V25_PACKAGE_ID
          Version Code : $V25_VERSION_CODE
          Version      : $V25_VERSION_NAME

          Source       : Sheti_V4_25.zip
          Flutter      : 3.35.2
          Java         : 17

          V25 signing files preserved.
          EOF


      # ==================================================
      # COPY APK
      # ==================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Sheti_V25_Base.apk

          sha256sum \
            release/Sheti_V25_Base.apk \
            > release/SHA256SUMS.txt


      # ==================================================
      # UPLOAD
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V25-Base-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
