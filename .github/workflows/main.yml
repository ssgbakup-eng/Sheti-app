
name: Sheti App V26 APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable

      - name: Extract V26 Source
        run: |
          test -f Sheti_V4_26.zip
          mkdir -p app
          unzip -q Sheti_V4_26.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
          test -f app/signing/key.properties
          test -f app/signing/sheti-release.jks
          test -f app/signing/app_build.gradle

      - name: Create Android Project
        working-directory: app
        run: |
          flutter create --platforms=android --org com.example .

      - name: Configure Android Signing and Version
        working-directory: app
        shell: bash
        run: |
          cp signing/app_build.gradle android/app/build.gradle
          mkdir -p android/signing
          cp signing/key.properties android/signing/key.properties
          cp signing/sheti-release.jks android/signing/sheti-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "com.example.sheti_app" not in s:
              s = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  'applicationId "com.example.sheti_app"',
                  s
              )

          s = re.sub(r'versionCode\s+\d+', 'versionCode 26', s)
          s = re.sub(r'versionName\s+["\'][^"\']+["\']',
                     'versionName "4.4.0"', s)

          p.write_text(s)
          PY

      - name: Set Java and Kotlin Target
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )
          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          p.write_text(s)
          PY

      - name: Get Dependencies
        working-directory: app
        run: |
          flutter clean
          flutter pub get

      - name: Build V26 Release APK
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi

      - name: Verify APK
        run: |
          APK="app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/Sheti_V4_26_ARM64.apk

      - name: Upload V26 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V26-APK
          path: release/Sheti_V4_26_ARM64.apk
          if-no-files-found: error
          retention-days: 14
