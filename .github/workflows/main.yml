name: Build Sheti V18 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract Sheti V18
        run: |
          rm -rf source
          mkdir source

          unzip -q Sheti_V4_18.zip -d source

          PROJECT_DIR=$(dirname "$(find source -name pubspec.yaml -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          rm -rf android

          flutter create . --platforms=android

          mkdir -p android/signing

          cp signing/sheti-release.jks \
             android/signing/sheti-release.jks

          cp signing/key.properties \
             android/signing/key.properties

          echo "Android project prepared."
          echo "Signing files copied."

      - name: Configure Android Release Signing
        run: |
          cd "$PROJECT_DIR"

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          import java.util.Properties

          def signingProperties = new Properties()
          def signingPropertiesFile =
              rootProject.file("signing/key.properties")

          if (signingPropertiesFile.exists()) {
              signingPropertiesFile.withInputStream {
                  signingProperties.load(it)
              }
          }

          android {
              namespace "com.example.sheti_app"

              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.example.sheti_app"

                  minSdk 23
                  targetSdk flutter.targetSdkVersion

                  versionCode 18
                  versionName "4.1.4"
              }

              signingConfigs {
                  release {
                      if (signingPropertiesFile.exists()) {
                          storeFile rootProject.file(
                              signingProperties["storeFile"]
                          )

                          storePassword =
                              signingProperties["storePassword"]

                          keyAlias =
                              signingProperties["keyAlias"]

                          keyPassword =
                              signingProperties["keyPassword"]
                      }
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source "../.."
          }
          EOF

          echo "Release signing + JVM 17 configuration applied."

      - name: Verify Configuration
        run: |
          cd "$PROJECT_DIR"

          echo "===== PACKAGE ====="
          grep "applicationId" android/app/build.gradle

          echo "===== VERSION ====="
          grep "versionCode" android/app/build.gradle
          grep "versionName" android/app/build.gradle

          echo "===== JAVA 17 ====="
          grep "JavaVersion.VERSION_17" android/app/build.gradle

          echo "===== KOTLIN 17 ====="
          grep "jvmTarget = \"17\"" android/app/build.gradle

          echo "===== RELEASE SIGNING ====="
          grep "signingConfig signingConfigs.release" android/app/build.gradle

          echo "===== SIGNING FILES ====="
          test -f android/signing/sheti-release.jks
          test -f android/signing/key.properties

          echo "ALL CONFIGURATION CHECKS PASSED."

      - name: Build Samsung S24 ARM64 APK
        run: |
          cd "$PROJECT_DIR"

          flutter clean

          flutter pub get

          flutter build apk \
            --release \
            --split-per-abi

      - name: Verify APK
        run: |
          cd "$PROJECT_DIR"

          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ARM64 APK NOT FOUND"
            exit 1
          fi

          echo "===== V18 APK CREATED ====="
          ls -lh "$APK"

      - name: Upload Sheti V18 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V18-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
