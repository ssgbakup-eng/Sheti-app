
name: Build Sheti V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract Sheti V3
        run: |
          rm -rf source
          mkdir source

          unzip -q Sheti_V3_3.zip -d source

          PROJECT_DIR=$(dirname "$(find source -name pubspec.yaml -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          rm -rf android

          flutter create . --platforms=android

          sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Samsung S24 ARM64 APK
        run: |
          cd "$PROJECT_DIR"

          flutter pub get

          flutter build apk --release --split-per-abi

      - name: Upload Samsung S24 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V3-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
