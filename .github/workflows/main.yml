name: Build Sheti V17 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract Sheti V17
        run: |
          rm -rf source
          mkdir source
          unzip -q Sheti_V4_17.zip -d source

          PROJECT_DIR=$(dirname "$(find source -name pubspec.yaml -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set V17 Version
        run: |
          cd "$PROJECT_DIR"

          sed -i 's/^version:.*/version: 4.1.3+17/' pubspec.yaml

          echo "V17 version set:"
          grep '^version:' pubspec.yaml

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          rm -rf android

          flutter create . --platforms=android

          mkdir -p android/signing

          cp signing/sheti-release.jks \
             android/signing/sheti-release.jks

          cp signing/key.properties \
             android/signing/key.properties

          echo "Android project created."
          echo "Signing files copied."

      - name: Configure Release Signing
        run: |
          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("build.gradle.kts not found")

          s = p.read_text()

          signing_code = r'''
          import java.util.Properties

          val signingProperties = Properties()
          val signingPropertiesFile = rootProject.file("signing/key.properties")

          if (signingPropertiesFile.exists()) {
              signingPropertiesFile.inputStream().use {
                  signingProperties.load(it)
              }
          }

          '''

          if "signing/key.properties" not in s:
              s = signing_code + s

          release_config = r'''
              signingConfigs {
                  create("release") {
                      if (signingPropertiesFile.exists()) {
                          storeFile = rootProject.file(
                              signingProperties["storeFile"] as String
                          )
                          storePassword =
                              signingProperties["storePassword"] as String
                          keyAlias =
                              signingProperties["keyAlias"] as String
                          keyPassword =
                              signingProperties["keyPassword"] as String
                      }
                  }
              }

          '''

          if 'create("release")' not in s:
              s = s.replace(
                  "    buildTypes {",
                  release_config + "    buildTypes {",
                  1
              )

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          p.write_text(s)

          print("Release signing configuration added.")
          PY

      - name: Verify Configuration
        run: |
          cd "$PROJECT_DIR"

          echo "Checking signing files..."
          test -f android/signing/sheti-release.jks
          test -f android/signing/key.properties

          echo "Checking Gradle..."
          test -f android/app/build.gradle.kts

          echo "Checking release signing..."
          grep -n 'create("release")' android/app/build.gradle.kts
          grep -n 'signingConfigs.getByName("release")' android/app/build.gradle.kts

          echo "Checking version..."
          grep '^version:' pubspec.yaml

          echo "Configuration verification PASSED."

      - name: Build Samsung S24 ARM64 APK
        run: |
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --split-per-abi

      - name: Verify APK
        run: |
          cd "$PROJECT_DIR"

          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ARM64 APK not found"
            exit 1
          fi

          echo "V17 APK created successfully:"
          ls -lh "$APK"

      - name: Upload Sheti V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V17-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
