
name: Sheti App V27 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Extract V27 Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Sheti_V4_27_JVM_FIXED.zip"

          if [ -f "$ZIP_FILE" ]; then
            mkdir -p source
            unzip -q "$ZIP_FILE" -d source
            if [ -f source/pubspec.yaml ]; then
              cp -a source/. .
            else
              PUBSPEC="$(find source -name pubspec.yaml -type f -print -quit)"
              if [ -z "$PUBSPEC" ]; then
                echo "ERROR: ZIP मध्ये pubspec.yaml सापडली नाही."
                exit 1
              fi
              PROJECT_DIR="$(dirname "$PUBSPEC")"
              cp -a "$PROJECT_DIR"/. .
            fi
          elif [ ! -f pubspec.yaml ]; then
            echo "ERROR: V27 ZIP किंवा root मध्ये pubspec.yaml सापडली नाही."
            echo "Repository मध्ये ZIP चे नाव आणि स्थान तपासा."
            exit 1
          fi

          test -f pubspec.yaml
          echo "Flutter project located."
          grep -E '^[[:space:]]*image:' pubspec.yaml || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Fix Image Dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          # Remove only the existing image entry from dependency_overrides.
          match = re.search(
              r"(?ms)^dependency_overrides\s*:\s*\n"
              r"(?P<body>.*?)(?=^[A-Za-z_][A-Za-z0-9_]*\s*:|\Z)",
              s
          )

          if match:
              body = match.group("body")
              body = re.sub(
                  r"(?m)^[ \t]*image\s*:[^\n]*(?:\n|$)",
                  "",
                  body
              )

              if body.strip():
                  replacement = "dependency_overrides:\n" + body
              else:
                  replacement = ""

              s = s[:match.start()] + replacement + s[match.end():]

          # Add image 4.11.1 override while retaining other overrides.
          match = re.search(
              r"(?m)^dependency_overrides\s*:\s*$",
              s
          )

          if match:
              insert_at = match.end()
              s = s[:insert_at] + "\n  image: 4.11.1" + s[insert_at:]
          else:
              s = s.rstrip() + "\n\ndependency_overrides:\n  image: 4.11.1\n"

          p.write_text(s)
          print("Updated dependency_overrides:")
          print(p.read_text())
          PY

          # Re-resolve dependencies from pubspec.yaml.
          rm -f pubspec.lock
          flutter pub get

      - name: Configure Android Java and Kotlin Targets
        shell: bash
        run: |
          set -euo pipefail

          if [ -f android/app/build.gradle ]; then
            FILE="android/app/build.gradle"
            python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])
          s = p.read_text()

          if "compileOptions" in s:
              s = re.sub(
                  r"(?s)compileOptions\s*\{.*?\}",
                  """compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }""",
                  s,
                  count=1
              )
          else:
              s = re.sub(
                  r"android\s*\{",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }""",
                  s,
                  count=1
              )

          if "kotlinOptions" in s:
              s = re.sub(
                  r"(?s)kotlinOptions\s*\{.*?\}",
                  """kotlinOptions {
                  jvmTarget = '17'
              }""",
                  s,
                  count=1
              )
          else:
              s = re.sub(
                  r"android\s*\{",
                  """android {
              kotlinOptions {
                  jvmTarget = '17'
              }""",
                  s,
                  count=1
              )

          p.write_text(s)
          PY
          elif [ -f android/app/build.gradle.kts ]; then
            echo "Kotlin DSL build.gradle.kts detected; keeping project configuration."
          else
            echo "ERROR: android/app/build.gradle not found."
            exit 1
          fi

      - name: Configure Android Audio Permission
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
            fi
          else
            echo "AndroidManifest.xml not found; skipping permission update."
          fi

      - name: Configure Release Signing Files
        shell: bash
        run: |
          set -euo pipefail

          if [ -f signing/app_build.gradle ]; then
            cp signing/app_build.gradle android/app/build.gradle
          fi

          if [ -f signing/key.properties ]; then
            mkdir -p android
            cp signing/key.properties android/key.properties
          fi

          if [ -f signing/sheti-release.jks ]; then
            mkdir -p android/app
            cp signing/sheti-release.jks android/app/sheti-release.jks
          fi

          echo "Signing files present in repository:"
          find signing android -maxdepth 3 -type f \
            \( -name 'key.properties' -o -name '*.jks' -o -name 'app_build.gradle' \) \
            -print 2>/dev/null || true

      - name: Verify Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK Exists
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK तयार झाली नाही."
            exit 1
          fi
          ls -lh "$APK"

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "WARNING: apksigner उपलब्ध नाही; signature verification वगळली."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-App-V27-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
