
name: Sheti App V25 APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check V25 ZIP
        run: |
          test -f Sheti_V4_25.zip || {
            echo "ERROR: Sheti_V4_25.zip not found in repository root"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Extract V25 Source
        run: |
          mkdir -p source project
          unzip -q Sheti_V4_25.zip -d source

      - name: Create Android Project
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name sheti_app \
            project

          cp source/pubspec.yaml project/pubspec.yaml
          rm -rf project/lib
          cp -r source/lib project/lib

          if [ -d source/assets ]; then
            cp -r source/assets project/assets
          fi

          mkdir -p project/android/signing
          cp source/signing/sheti-release.jks \
            project/android/signing/
          cp source/signing/key.properties \
            project/android/signing/

      - name: Configure Release Signing
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "signing/key.properties" not in s:
              prefix = """
          import java.util.Properties

          """
              marker = re.search(
                  r"(?m)^plugins\\s*\\{.*?^\\}",
                  s,
                  re.S
              )
              if not marker:
                  raise SystemExit("Gradle plugins block not found")

              config = """
          def signingProperties = new Properties()
          def signingFile = rootProject.file("signing/key.properties")
          if (!signingFile.exists()) {
              throw new GradleException("Signing key properties missing")
          }
          signingFile.withInputStream {
              signingProperties.load(it)
          }

          """
              s = prefix + s
              marker = re.search(
                  r"(?m)^plugins\\s*\\{.*?^\\}",
                  s,
                  re.S
              )
              s = s[:marker.end()] + "\\n" + config + s[marker.end():]

          if "signingConfigs {" not in s:
              block = """
              signingConfigs {
                  release {
                      storeFile rootProject.file(
                          signingProperties.getProperty("storeFile")
                      )
                      storePassword signingProperties.getProperty("storePassword")
                      keyAlias signingProperties.getProperty("keyAlias")
                      keyPassword signingProperties.getProperty("keyPassword")
                  }
              }

          """
              s, count = re.subn(
                  r"(?m)^\\s*buildTypes\\s*\\{",
                  block + "    buildTypes {",
                  s,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Gradle buildTypes block not found")

          s, count = re.subn(
              r"signingConfig\\s*=\\s*signingConfigs\\.debug",
              "signingConfig = signingConfigs.release",
              s
          )

          if count == 0 and "signingConfigs.release" not in s:
              raise SystemExit("Release signing configuration not applied")

          p.write_text(s)
          PY

      - name: Get Dependencies
        working-directory: project
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        working-directory: project
        run: |
          flutter build apk \
            --release \
            --split-per-abi

      - name: Rename ARM64 APK
        working-directory: project
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            ../Sheti_V4_25_ARM64.apk

      - name: Upload V25 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V25-APK
          path: Sheti_V4_25_ARM64.apk
          if-no-files-found: error
