
      - name: Extract V26 Source
        shell: bash
        run: |
          set -e
          test -f Sheti_V4_26.zip

          mkdir -p extracted
          unzip -q Sheti_V4_26.zip -d extracted

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [ -d "$dir/android" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find extracted -type f -name pubspec.yaml)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project with android folder not found."
            echo "ZIP folder structure:"
            find extracted -maxdepth 5 -type d | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Correct Flutter project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/android"
