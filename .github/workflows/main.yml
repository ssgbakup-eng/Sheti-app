
name: Sheti App V25 APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check V25 ZIP
        shell: bash
        run: |
          test -f Sheti_V4_25.zip || {
            echo "ERROR: Sheti_V4_25.zip not found in repository root"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Extract V25 Source
        shell: bash
        run: |
          mkdir -p source
          unzip -q Sheti_V4_25.zip -d source

          test -f source/pubspec.yaml
          test -f source/lib/main.dart
          test -f source/signing/app_build.gradle
          test -f source/signing/key.properties
          test -f source/signing/sheti-release.jks

      - name: Create Android Project
        shell: bash
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name sheti_app \
            project

          cp source/pubspec.yaml project/pubspec.yaml

          rm -rf project/lib
          cp -r source/lib project/lib

          if [ -d source/assets ]; then
            cp -r source/assets project/assets
          fi

      - name: Configure Release Signing
        shell: bash
        run: |
          mkdir -p project/android/signing

          cp source/signing/app_build.gradle \
            project/android/app/build.gradle

          cp source/signing/key.properties \
            project/android/signing/key.properties

          cp source/signing/sheti-release.jks \
            project/android/signing/sheti-release.jks

          rm -f project/android/app/build.gradle.kts

          test -f project/android/app/build.gradle
          test -f project/android/signing/key.properties
          test -f project/android/signing/sheti-release.jks

      - name: Get Dependencies
        working-directory: project
        run: |
          flutter clean
          flutter pub get

      - name: Check Dart Code
        working-directory: project
        run: |
          flutter analyze --no-pub

      - name: Build Release APK
        working-directory: project
        run: |
          flutter build apk \
            --release \
            --split-per-abi

      - name: Verify APK
        shell: bash
        run: |
          test -f project/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

          mkdir -p release
          cp project/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            release/Sheti_V4_25_ARM64.apk

      - name: Upload V25 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V25-APK
          path: release/Sheti_V4_25_ARM64.apk
          if-no-files-found: error
          retention-days: 14
