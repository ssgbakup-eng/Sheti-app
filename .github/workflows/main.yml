name: Build Sheti V17 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract Sheti V4.16
        run: |
          rm -rf source
          mkdir source
          unzip -q Sheti_V4_16.zip -d source

          PROJECT_DIR=$(dirname "$(find source -name pubspec.yaml -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          rm -rf android

          flutter create . --platforms=android

          echo "Applying Sheti release signing configuration..."

          mkdir -p android/signing

          cp signing/sheti-release.jks \
             android/signing/sheti-release.jks

          cp signing/key.properties \
             android/signing/key.properties

          cp signing/app_build.gradle \
             android/app/build.gradle

          echo "Signing files applied."

      - name: Verify Android Configuration
        run: |
          cd "$PROJECT_DIR"

          echo "Checking application ID..."
          grep -n "applicationId" android/app/build.gradle

          echo "Checking version..."
          grep -n "versionCode" android/app/build.gradle
          grep -n "versionName" android/app/build.gradle

          echo "Checking release signing..."
          grep -n "signingConfig signingConfigs.release" android/app/build.gradle

          echo "Checking keystore..."
          test -f android/signing/sheti-release.jks

          echo "Checking key.properties..."
          test -f android/signing/key.properties

          echo "Android configuration verified."

      - name: Build Samsung S24 ARM64 APK
        run: |
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --split-per-abi

      - name: Verify APK
        run: |
          cd "$PROJECT_DIR"

          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ARM64 APK not found"
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

      - name: Upload Sheti V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V17-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
