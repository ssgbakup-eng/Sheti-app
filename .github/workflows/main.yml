name: Build Sheti APK from V25

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti APK from V25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract V25 Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Sheti_V4_25.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          rm -rf /tmp/sheti_v25
          mkdir -p /tmp/sheti_v25

          unzip -q "$ZIP" -d /tmp/sheti_v25

          PUBSPEC="$(find /tmp/sheti_v25 -name pubspec.yaml -type f -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside V25 ZIP"
            exit 1
          fi

          V25_DIR="$(dirname "$PUBSPEC")"

          echo "V25_DIR=$V25_DIR" >> "$GITHUB_ENV"

          test -f "$V25_DIR/pubspec.yaml"
          test -f "$V25_DIR/lib/main.dart"
          test -f "$V25_DIR/signing/app_build.gradle"
          test -f "$V25_DIR/signing/key.properties"
          test -f "$V25_DIR/signing/sheti-release.jks"

          echo "V25 source verified."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.35.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Create Android Template Separately
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/sheti_android_template

          mkdir -p /tmp/sheti_android_template

          cd /tmp/sheti_android_template

          flutter create \
            --platforms=android \
            --project-name sheti_app \
            --org com.example \
            .

          test -d android
          test -f android/app/build.gradle
          test -f android/settings.gradle

          echo "Separate Android template created successfully."

      - name: Copy Android Template Into V25
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$V25_DIR/android"

          cp -a /tmp/sheti_android_template/android "$V25_DIR/android"

          test -d "$V25_DIR/android"
          test -f "$V25_DIR/android/app/build.gradle"
          test -f "$V25_DIR/android/settings.gradle"

          echo "Android template copied into V25."

      - name: Apply V25 Signing Configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$V25_DIR/android/signing"

          cp "$V25_DIR/signing/key.properties" \
             "$V25_DIR/android/signing/key.properties"

          cp "$V25_DIR/signing/sheti-release.jks" \
             "$V25_DIR/android/signing/sheti-release.jks"

          cp "$V25_DIR/signing/app_build.gradle" \
             "$V25_DIR/android/app/build.gradle"

          echo "V25 signing files applied."

      - name: Configure Flutter Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          FILE="$V25_DIR/android/app/build.gradle"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if 'dev.flutter.flutter-gradle-plugin' not in s:
              marker = 'id "org.jetbrains.kotlin.android"'

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + '\n    id "dev.flutter.flutter-gradle-plugin"',
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: Kotlin Android plugin not found."
                  )

          if 'flutter {' not in s:
              s += '\n\nflutter {\n    source = "../.."\n}\n'

          p.write_text(s)

          print("Flutter Gradle plugin configured.")
          PY

      - name: Configure Java 17 and Kotlin 17
        shell: bash
        run: |
          set -euo pipefail

          FILE="$V25_DIR/android/app/build.gradle"

          cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "Java/Kotlin 17 configured."

      - name: Configure Audio Permission
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$V25_DIR/android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i \
                '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
                "$MANIFEST"
            fi
          fi

      - name: Show V25 App Information
        shell: bash
        run: |
          set -euo pipefail

          echo "===== V25 PUBSPEC VERSION ====="
          grep -n "^version:" "$V25_DIR/pubspec.yaml" || true

          echo "===== V25 APP BUILD GRADLE ====="
          grep -nE "applicationId|versionCode|versionName" \
            "$V25_DIR/android/app/build.gradle" || true

      - name: Flutter Pub Get
        shell: bash
        working-directory: ${{ env.V25_DIR }}
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

      - name: Build V25 APK
        shell: bash
        working-directory: ${{ env.V25_DIR }}
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK
        shell: bash
        working-directory: ${{ env.V25_DIR }}
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" \
            -name apksigner -type f 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          AAPT="$(find "$SDK_ROOT/build-tools" \
            -name aapt -type f 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "ERROR: Android verification tools not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep "^package:"

          echo "===== APK INFO ====="
          echo "$BADGING" | grep "^package:"

          mkdir -p release

          cp "$APK" release/Sheti_V25_Update.apk

          sha256sum release/Sheti_V25_Update.apk \
            > release/SHA256SUMS.txt

          echo "APK verification successful."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V25-Update-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
