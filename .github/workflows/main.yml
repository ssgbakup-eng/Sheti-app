name: Build Sheti APK V25 Base

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti APK from V25
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. EXTRACT V25 ONLY
      # --------------------------------------------------
      - name: Extract V25 Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Sheti_V4_25.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          fi

          rm -rf /tmp/sheti_v25
          mkdir -p /tmp/sheti_v25

          unzip -q "$ZIP_FILE" -d /tmp/sheti_v25

          PUBSPEC="$(find /tmp/sheti_v25 \
            -name pubspec.yaml \
            -type f \
            -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside V25 ZIP."
            exit 1
          fi

          V25_DIR="$(dirname "$PUBSPEC")"

          echo "V25 PROJECT:"
          echo "$V25_DIR"

          cp -a "$V25_DIR"/. "$GITHUB_WORKSPACE"/

          test -f pubspec.yaml
          test -d lib
          test -d assets
          test -d signing
          test -f signing/app_build.gradle
          test -f signing/key.properties
          test -f signing/sheti-release.jks

          echo "V25 source verified successfully."


      # --------------------------------------------------
      # 3. READ V25 APP VERSION
      # --------------------------------------------------
      - name: Read V25 App Version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_LINE="$(grep -E '^version:' pubspec.yaml | head -n 1)"

          if [ -z "$VERSION_LINE" ]; then
            echo "ERROR: version not found in pubspec.yaml"
            exit 1
          fi

          VERSION="$(echo "$VERSION_LINE" | sed 's/^version:[[:space:]]*//')"

          echo "V25_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "================================"
          echo "V25 APP VERSION"
          echo "$VERSION"
          echo "================================"


      # --------------------------------------------------
      # 4. READ V25 PACKAGE ID
      # --------------------------------------------------
      - name: Read V25 Package ID
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="signing/app_build.gradle"

          PACKAGE_ID="$(grep -E 'applicationId[[:space:]]+' "$GRADLE" \
            | head -n 1 \
            | sed -E 's/.*applicationId[[:space:]]+"([^"]+)".*/\1/')"

          if [ -z "$PACKAGE_ID" ]; then
            echo "ERROR: applicationId not found in signing/app_build.gradle"
            exit 1
          fi

          echo "V25_PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"

          echo "================================"
          echo "V25 PACKAGE ID"
          echo "$PACKAGE_ID"
          echo "================================"


      # --------------------------------------------------
      # 5. READ V25 VERSION CODE
      # --------------------------------------------------
      - name: Read V25 Version Code
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="signing/app_build.gradle"

          VERSION_CODE="$(grep -E 'versionCode[[:space:]]+' "$GRADLE" \
            | head -n 1 \
            | sed -E 's/.*versionCode[[:space:]]+([0-9]+).*/\1/')"

          if [ -z "$VERSION_CODE" ]; then
            echo "ERROR: versionCode not found."
            exit 1
          fi

          echo "V25_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "================================"
          echo "V25 VERSION CODE"
          echo "$VERSION_CODE"
          echo "================================"


      # --------------------------------------------------
      # 6. SET JAVA 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 7. SET FLUTTER
      # --------------------------------------------------
      - name: Setup Flutter 3.35.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true


      # --------------------------------------------------
      # 8. CREATE ANDROID PROJECT
      # --------------------------------------------------
      - name: Create Android Project
        shell: bash
        run: |
          set -euo pipefail

          flutter create \
            --platforms=android \
            --project-name sheti_app \
            --org com.example \
            .

          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Android project created."


      # --------------------------------------------------
      # 9. BACKUP GENERATED GRADLE
      # --------------------------------------------------
      - name: Backup Generated Android Gradle
        shell: bash
        run: |
          set -euo pipefail

          cp android/app/build.gradle \
            /tmp/generated_build.gradle


      # --------------------------------------------------
      # 10. COPY V25 SIGNING FILES
      # --------------------------------------------------
      - name: Apply V25 Signing Configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/signing

          cp signing/key.properties \
            android/signing/key.properties

          cp signing/sheti-release.jks \
            android/signing/sheti-release.jks

          cp signing/app_build.gradle \
            android/app/build.gradle

          test -f android/signing/key.properties
          test -f android/signing/sheti-release.jks
          test -f android/app/build.gradle

          echo "V25 signing files copied."


      # --------------------------------------------------
      # 11. MAKE SURE FLUTTER GRADLE PLUGIN EXISTS
      # --------------------------------------------------
      - name: Ensure Flutter Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          flutter_plugin = 'id "dev.flutter.flutter-gradle-plugin"'

          if flutter_plugin not in s:
              marker = 'id "org.jetbrains.kotlin.android"'

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\n    " + flutter_plugin,
                      1
                  )
              else:
                  s = s.replace(
                      'plugins {',
                      'plugins {\n    ' + flutter_plugin,
                      1
                  )

          if 'flutter {' not in s:
              s += """

          flutter {
              source = "../.."
          }
          """

          p.write_text(s)

          print("Flutter Gradle plugin verified.")
          PY


      # --------------------------------------------------
      # 12. FORCE JAVA / KOTLIN 17
      # --------------------------------------------------
      - name: Configure Java and Kotlin 17
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "compileOptions" not in s:
              s += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

          if "kotlinOptions" not in s:
              s += """

          kotlinOptions {
              jvmTarget = "17"
          }
          """

          p.write_text(s)

          print("Java/Kotlin 17 configuration completed.")
          PY


      # --------------------------------------------------
      # 13. AUDIO PERMISSION
      # --------------------------------------------------
      - name: Configure Audio Permission
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            if ! grep -q \
              "android.permission.RECORD_AUDIO" \
              "$MANIFEST"; then

              sed -i \
                '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
                "$MANIFEST"

            fi

          fi

          echo "Audio permission verified."


      # --------------------------------------------------
      # 14. CHECK PACKAGE ID / VERSION
      # --------------------------------------------------
      - name: Verify V25 Identity
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "          V25 APP INFORMATION"
          echo "=============================================="
          echo "App Version   : $V25_VERSION"
          echo "Version Code  : $V25_VERSION_CODE"
          echo "Package ID    : $V25_PACKAGE_ID"
          echo "=============================================="
          echo ""

          grep -q \
            "applicationId \"$V25_PACKAGE_ID\"" \
            android/app/build.gradle

          grep -q \
            "versionCode $V25_VERSION_CODE" \
            android/app/build.gradle

          echo "V25 identity verified."


      # --------------------------------------------------
      # 15. FLUTTER PUB GET
      # --------------------------------------------------
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get


      # --------------------------------------------------
      # 16. BUILD APK
      # --------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64


      # --------------------------------------------------
      # 17. VERIFY APK
      # --------------------------------------------------
      - name: Verify APK Package
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" \
            -name apksigner \
            -type f \
            2>/dev/null \
            | sort -V \
            | tail -n 1 || true)"

          AAPT="$(find "$SDK_ROOT/build-tools" \
            -name aapt \
            -type f \
            2>/dev/null \
            | sort -V \
            | tail -n 1 || true)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "          APK INFORMATION"
          echo "=============================================="

          "$APKSIGNER" verify --verbose "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep "^package:"

          APK_PACKAGE="$(
            echo "$BADGING" \
            | sed -n "s/.*name='\([^']*\)'.*/\1/p" \
            | head -n 1
          )"

          APK_VERSION_CODE="$(
            echo "$BADGING" \
            | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" \
            | head -n 1
          )"

          APK_VERSION_NAME="$(
            echo "$BADGING" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" \
            | head -n 1
          )"

          echo "APK Package ID   : $APK_PACKAGE"
          echo "APK Version Code : $APK_VERSION_CODE"
          echo "APK Version Name : $APK_VERSION_NAME"

          if [ "$APK_PACKAGE" != "$V25_PACKAGE_ID" ]; then
            echo ""
            echo "ERROR: PACKAGE ID CHANGED!"
            echo "Expected: $V25_PACKAGE_ID"
            echo "Actual  : $APK_PACKAGE"
            exit 1
          fi

          if [ "$APK_VERSION_CODE" != "$V25_VERSION_CODE" ]; then
            echo ""
            echo "ERROR: VERSION CODE MISMATCH!"
            echo "Expected: $V25_VERSION_CODE"
            echo "Actual  : $APK_VERSION_CODE"
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK"

          echo ""
          echo "APK PACKAGE AND SIGNATURE VERIFIED."


      # --------------------------------------------------
      # 18. SAVE APP INFO
      # --------------------------------------------------
      - name: Create App Info
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cat > release/APP_INFO.txt <<EOF
          SHETI APP - V25 BASE BUILD

          App Version   : $V25_VERSION
          Version Code  : $V25_VERSION_CODE
          Package ID    : $V25_PACKAGE_ID

          Base Source   : Sheti_V4_25.zip
          Flutter       : 3.35.2
          Java           : 17

          This APK is built from V25 Base.
          V25 signing files are preserved.
          EOF

          cat release/APP_INFO.txt


      # --------------------------------------------------
      # 19. COPY APK
      # --------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Sheti_V25_Base.apk

          sha256sum \
            release/Sheti_V25_Base.apk \
            > release/SHA256SUMS.txt


      # --------------------------------------------------
      # 20. UPLOAD APK
      # --------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V25-Base-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
