
name: Build Sheti APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti App V27
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract V27 Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Sheti_V4_27_JVM_FIXED.zip"

          if [ -f "$ZIP_FILE" ]; then
            mkdir -p /tmp/sheti_source
            unzip -q "$ZIP_FILE" -d /tmp/sheti_source

            PUBSPEC="$(find /tmp/sheti_source -name pubspec.yaml -type f -print -quit)"
            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: ZIP मध्ये pubspec.yaml सापडली नाही."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Flutter project किंवा source ZIP सापडली नाही."
            exit 1
          fi

          echo "Flutter project found."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Fix Image and Archive Dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          # Remove existing image/archive entries from dependency_overrides.
          pattern = (
              r"(?ms)^dependency_overrides\s*:\s*\n"
              r"(.*?)(?=^[A-Za-z_][A-Za-z0-9_]*\s*:|\Z)"
          )
          m = re.search(pattern, s)

          if m:
              body = re.sub(
                  r"(?m)^[ \t]*(image|archive)\s*:[^\n]*(?:\n|$)",
                  "",
                  m.group(1)
              )
              if body.strip():
                  replacement = "dependency_overrides:\n" + body
              else:
                  replacement = ""
              s = s[:m.start()] + replacement + s[m.end():]

          s = s.rstrip()

          if re.search(r"(?m)^dependency_overrides\s*:", s):
              s = re.sub(
                  r"(?m)^dependency_overrides\s*:\s*$",
                  "dependency_overrides:\n"
                  "  image: 4.11.1\n"
                  "  archive: ^4.4.0",
                  s,
                  count=1
              )
          else:
              s += (
                  "\n\ndependency_overrides:\n"
                  "  image: 4.11.1\n"
                  "  archive: ^4.4.0\n"
              )

          p.write_text(s)
          print("Dependency overrides updated.")
          PY

          rm -f pubspec.lock
          flutter pub get

      - name: Configure Java and Kotlin Targets
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="android/app/build.gradle"

          if [ -f "$GRADLE_FILE" ]; then
            python3 - "$GRADLE_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          java_block = """compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""

          if re.search(r"(?s)compileOptions\s*\{.*?\}", s):
              s = re.sub(
                  r"(?s)compileOptions\s*\{.*?\}",
                  java_block,
                  s,
                  count=1
              )
          elif re.search(r"\bandroid\s*\{", s):
              s = re.sub(
                  r"\bandroid\s*\{",
                  "android {\n    " + java_block,
                  s,
                  count=1
              )

          kotlin_block = """kotlinOptions {
                  jvmTarget = '17'
              }"""

          if re.search(r"(?s)kotlinOptions\s*\{.*?\}", s):
              s = re.sub(
                  r"(?s)kotlinOptions\s*\{.*?\}",
                  kotlin_block,
                  s,
                  count=1
              )
          else:
              s = re.sub(
                  r"\bandroid\s*\{",
                  "android {\n    " + kotlin_block,
                  s,
                  count=1
              )

          p.write_text(s)
          PY
          elif [ -f android/app/build.gradle.kts ]; then
            echo "Kotlin DSL detected; leaving its Gradle configuration unchanged."
          else
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

      - name: Configure Release Signing
        shell: bash
        run: |
          set -euo pipefail

          if [ -f signing/app_build.gradle ]; then
            cp signing/app_build.gradle android/app/build.gradle
          fi

          if [ -f signing/key.properties ]; then
            cp signing/key.properties android/key.properties
          fi

          if [ -f signing/sheti-release.jks ]; then
            mkdir -p android/app
            cp signing/sheti-release.jks android/app/sheti-release.jks
          fi

          echo "Checking signing configuration..."
          if [ -f android/key.properties ]; then
            echo "key.properties found."
          else
            echo "WARNING: key.properties not found."
          fi

          if [ -f android/app/sheti-release.jks ]; then
            echo "Release keystore found."
          else
            echo "WARNING: release keystore not found."
          fi

      - name: Configure Audio Permission
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
              sed -i \
                '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
                "$MANIFEST"
            fi
          fi

      - name: Resolve Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK तयार झाली नाही."
            exit 1
          fi

          ls -lh "$APK"

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "WARNING: apksigner not found; signature verification skipped."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-App-V27-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
