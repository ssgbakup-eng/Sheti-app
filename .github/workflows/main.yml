name: Build Sheti APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sheti App V27
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. EXTRACT V27 SOURCE
      # --------------------------------------------------
      - name: Extract and Validate V27 Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Sheti_V4_27_JVM_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          fi

          rm -rf /tmp/sheti_v27
          mkdir -p /tmp/sheti_v27

          unzip -q "$ZIP_FILE" -d /tmp/sheti_v27

          PUBSPEC="$(find /tmp/sheti_v27 \
            -name pubspec.yaml \
            -type f \
            -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside V27 ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f signing/app_build.gradle
          test -f signing/key.properties
          test -f signing/sheti-release.jks

          echo "----------------------------------------"
          echo "V27 SOURCE VERIFIED"
          echo "----------------------------------------"


      # --------------------------------------------------
      # 3. JAVA 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 4. FLUTTER
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true


      # --------------------------------------------------
      # 5. GENERATE ANDROID PROJECT
      # --------------------------------------------------
      - name: Generate Android Project
        shell: bash
        run: |
          set -u

          echo "Generating Android project..."

          flutter create \
            --platforms=android \
            --project-name sheti_app \
            --org com.example \
            . || CREATE_EXIT=$?

          CREATE_EXIT="${CREATE_EXIT:-0}"

          echo "flutter create exit code: $CREATE_EXIT"

          if [ ! -f "android/app/build.gradle" ] && \
             [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: Android project was not created."
            exit 1
          fi

          echo "Android project files are present."


      # --------------------------------------------------
      # 6. RESTORE ORIGINAL SIGNING CONFIGURATION
      # --------------------------------------------------
      - name: Configure Original Signing and Flutter Gradle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/signing

          cp signing/key.properties \
             android/signing/key.properties

          cp signing/sheti-release.jks \
             android/signing/sheti-release.jks

          cp signing/app_build.gradle \
             android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Flutter Gradle plugin
          if 'id "dev.flutter.flutter-gradle-plugin"' not in s:
              marker = 'id "org.jetbrains.kotlin.android"'

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + '\n    id "dev.flutter.flutter-gradle-plugin"',
                      1
                  )

          # Flutter source block
          if not re.search(r"(?m)^flutter\s*\{", s):
              s += '\n\nflutter {\n    source = "../.."\n}\n'

          p.write_text(s)

          # Application ID check
          match = re.search(
              r'applicationId\s+["\']([^"\']+)["\']',
              s
          )

          if not match:
              raise SystemExit(
                  "ERROR: applicationId not found in signing/app_build.gradle"
              )

          package_id = match.group(1)

          print("----------------------------------------")
          print("V27 APPLICATION ID")
          print(package_id)
          print("----------------------------------------")

          # Version code must be 27
          version_match = re.search(
              r'versionCode\s+(\d+)',
              s
          )

          if not version_match:
              raise SystemExit(
                  "ERROR: versionCode not found."
              )

          version_code = int(version_match.group(1))

          print("V27 VERSION CODE =", version_code)

          if version_code != 27:
              raise SystemExit(
                  f"ERROR: Expected versionCode 27, found {version_code}"
              )

          print("----------------------------------------")
          print("SIGNING CONFIGURATION RESTORED")
          print("----------------------------------------")
          PY

          test -f android/signing/key.properties
          test -f android/signing/sheti-release.jks


      # --------------------------------------------------
      # 7. VERIFY JAVA / KOTLIN
      # --------------------------------------------------
      - name: Verify Java and Kotlin Targets
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'sourceCompatibility JavaVersion.VERSION_17' \
            android/app/build.gradle

          grep -q \
            'targetCompatibility JavaVersion.VERSION_17' \
            android/app/build.gradle

          grep -q \
            'jvmTarget = "17"' \
            android/app/build.gradle

          echo "Java 17 and Kotlin JVM 17 verified."


      # --------------------------------------------------
      # 8. AUDIO PERMISSION
      # --------------------------------------------------
      - name: Configure Audio Permission
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ] && \
             ! grep -q \
             'android.permission.RECORD_AUDIO' \
             "$MANIFEST"; then

            sed -i \
              '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
              "$MANIFEST"
          fi

          echo "RECORD_AUDIO permission configured."


      # --------------------------------------------------
      # 9. FIX IMAGE DEPENDENCY
      # --------------------------------------------------
      - name: Fix Image Dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          # Remove previous image override
          s = re.sub(
              r"(?m)^[ \t]*image:[ \t]*4\.9\.1[ \t]*\n?",
              "",
              s
          )

          s = re.sub(
              r"(?m)^[ \t]*image:[ \t]*4\.11\.1[ \t]*\n?",
              "",
              s
          )

          s = re.sub(
              r"(?m)^[ \t]*image:[ \t]*4\.5\.4[ \t]*\n?",
              "",
              s
          )

          # Remove existing dependency_overrides block
          s = re.sub(
              r"(?ms)^dependency_overrides:[ \t]*\n.*?(?=^[A-Za-z_][A-Za-z0-9_]*[ \t]*:|\Z)",
              "",
              s
          )

          s = s.rstrip()

          s += """

          dependency_overrides:
            image: 4.5.4
          """

          p.write_text(s)

          print("image dependency override = 4.5.4")
          PY

          rm -f pubspec.lock

          flutter pub get


      # --------------------------------------------------
      # 10. VERIFY DEPENDENCIES
      # --------------------------------------------------
      - name: Verify Flutter Dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "----------------------------------------"
          echo "IMPORTANT DEPENDENCIES"
          echo "----------------------------------------"

          flutter pub deps | grep -E \
            "image|archive|pdf" || true

          echo "Dependency verification completed."


      # --------------------------------------------------
      # 11. BUILD APK
      # --------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter clean

          flutter pub get

          flutter build apk \
            --release \
            --target-platform android-arm64

          test -s \
            build/app/outputs/flutter-apk/app-release.apk

          echo "----------------------------------------"
          echo "APK BUILD SUCCESSFUL"
          echo "----------------------------------------"


      # --------------------------------------------------
      # 12. APK DIAGNOSTIC
      # --------------------------------------------------
      - name: APK Diagnostic and Update Compatibility Check
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -name apksigner \
              -type f \
              2>/dev/null |
            sort -V |
            tail -n 1
          )"

          AAPT="$(
            find "$SDK_ROOT/build-tools" \
              -name aapt \
              -type f \
              2>/dev/null |
            sort -V |
            tail -n 1
          )"

          ZIPALIGN="$(
            find "$SDK_ROOT/build-tools" \
              -name zipalign \
              -type f \
              2>/dev/null |
            sort -V |
            tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          echo "----------------------------------------"
          echo "APK SIZE"
          ls -lh "$APK"
          echo "----------------------------------------"

          echo "----------------------------------------"
          echo "APK PACKAGE INFORMATION"
          echo "----------------------------------------"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep "^package:"

          echo "$BADGING" | grep "^sdkVersion:" || true
          echo "$BADGING" | grep "^targetSdkVersion:" || true

          echo "----------------------------------------"
          echo "APK SIGNATURE VERIFICATION"
          echo "----------------------------------------"

          "$APKSIGNER" verify --verbose "$APK"

          echo "----------------------------------------"
          echo "APK CERTIFICATE"
          echo "----------------------------------------"

          "$APKSIGNER" verify --print-certs "$APK"

          echo "----------------------------------------"
          echo "ZIPALIGN CHECK"
          echo "----------------------------------------"

          "$ZIPALIGN" -c -v 4 "$APK"

          echo "----------------------------------------"
          echo "SHA256"
          echo "----------------------------------------"

          sha256sum "$APK"

          echo "----------------------------------------"
          echo "V27 UPDATE CHECK"
          echo "----------------------------------------"

          echo "Package ID must remain identical to V25."
          echo "Signing certificate must remain identical to V25."
          echo "VersionCode = 27."

          echo "----------------------------------------"
          echo "APK DIAGNOSTIC PASSED"
          echo "----------------------------------------"


      # --------------------------------------------------
      # 13. PREPARE RELEASE
      # --------------------------------------------------
      - name: Prepare Release Files
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          mkdir -p release

          cp "$APK" \
            release/Sheti_V27_arm64.apk

          sha256sum \
            release/Sheti_V27_arm64.apk \
            > release/SHA256SUMS.txt

          echo "Release files prepared."


      # --------------------------------------------------
      # 14. UPLOAD APK
      # --------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V27-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
