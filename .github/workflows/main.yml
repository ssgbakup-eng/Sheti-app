
name: Build Sheti App V27 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V27 Fixed Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Sheti_V4_27_JVM_FIXED.zip"
          test -f "$ZIP"

          mkdir -p source
          unzip -q "$ZIP" -d source

          if [ -f source/pubspec.yaml ]; then
            cp -a source/. ./
          else
            PUBSPEC="$(find source -name pubspec.yaml -print -quit)"
            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: pubspec.yaml not found"
              exit 1
            fi
            ROOT="$(dirname "$PUBSPEC")"
            cp -a "$ROOT"/. ./
          fi

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f signing/app_build.gradle
          test -f signing/key.properties
          test -f signing/sheti-release.jks

      - name: Fix image dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          if re.search(r"(?m)^dependency_overrides:", s):
              if not re.search(
                  r"(?m)^  image\s*:", s
              ):
                  s = s.rstrip() + "\n  image: 4.10.0\n"
          else:
              s = s.rstrip()
              s += "\n\ndependency_overrides:\n"
              s += "  image: 4.10.0\n"

          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name sheti_app \
            --org com.example .

      - name: Configure signing and Gradle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/signing

          cp signing/key.properties \
            android/signing/key.properties
          cp signing/sheti-release.jks \
            android/signing/sheti-release.jks
          cp signing/app_build.gradle \
            android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          marker = 'id "org.jetbrains.kotlin.android"'
          plugin = 'id "dev.flutter.flutter-gradle-plugin"'

          if plugin not in s:
              if marker not in s:
                  raise SystemExit(
                      "Kotlin plugin marker missing; "
                      "check signing/app_build.gradle"
                  )
              s = s.replace(marker, marker + "\n    " + plugin, 1)

          # Normalize existing Java 8 targets.
          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          # Set Java compile compatibility to 17.
          if re.search(r'\bcompileOptions\s*\{', s):
              pattern = r'\bcompileOptions\s*\{[^}]*\}'
              m = re.search(pattern, s, re.S)
              block = m.group(0)

              for key in (
                  "sourceCompatibility",
                  "targetCompatibility"
              ):
                  line = (
                      f"{key} JavaVersion.VERSION_17"
                  )
                  if re.search(rf'\b{key}\b', block):
                      block = re.sub(
                          rf'\b{key}\s+[^;\n]+;?',
                          line,
                          block
                      )
                  else:
                      block = block[:-1] + "\n        " + line + "\n    }"

              s = s[:m.start()] + block + s[m.end():]
          else:
              s = re.sub(
                  r'\bandroid\s*\{',
                  'android {\n    compileOptions {\n'
                  '        sourceCompatibility JavaVersion.VERSION_17\n'
                  '        targetCompatibility JavaVersion.VERSION_17\n'
                  '    }\n',
                  s, count=1
              )

          # Set Kotlin JVM target to 17.
          if re.search(r'\bkotlinOptions\s*\{', s):
              s = re.sub(
                  r'jvmTarget\s*=\s*["\'][^"\']+["\']',
                  'jvmTarget = "17"',
                  s
              )
          else:
              s = re.sub(
                  r'\bandroid\s*\{',
                  'android {\n    kotlinOptions {\n'
                  '        jvmTarget = "17"\n'
                  '    }\n',
                  s, count=1
              )

          if not re.search(r'\bflutter\s*\{', s):
              s += '\n\nflutter {\n    source = "../.."\n}\n'

          # Apply compatible targets to all Java/Kotlin compile tasks.
          s += """

          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
          }

          tasks.withType(
              org.jetbrains.kotlin.gradle.tasks.KotlinCompile
          ).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

          p.write_text(s)
          print("Gradle JVM configuration updated.")
          PY

          grep -q 'VERSION_17' android/app/build.gradle
          grep -q 'jvmTarget = "17"' android/app/build.gradle

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          mkdir -p release
          cp "$APK" release/Sheti_V4_27_arm64.apk
          sha256sum release/Sheti_V4_27_arm64.apk \
            > release/SHA256SUMS.txt

      - name: Upload V27 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti_V4_27_APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
