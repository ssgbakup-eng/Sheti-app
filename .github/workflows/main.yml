
name: Sheti App V25 APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check V25 ZIP
        shell: bash
        run: |
          test -f Sheti_V4_25.zip || {
            echo "ERROR: Sheti_V4_25.zip not found"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Extract V25 Source
        shell: bash
        run: |
          mkdir -p source
          unzip -q Sheti_V4_25.zip -d source

          test -f source/pubspec.yaml
          test -f source/lib/main.dart
          test -f source/signing/key.properties
          test -f source/signing/sheti-release.jks

      - name: Create Flutter Project
        shell: bash
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name sheti_app \
            project

          cp source/pubspec.yaml project/pubspec.yaml

          rm -rf project/lib
          cp -r source/lib project/lib

          if [ -d source/assets ]; then
            cp -r source/assets/. project/assets/
          fi

      - name: Configure Android Signing
        shell: bash
        run: |
          mkdir -p project/android/signing

          cp source/signing/key.properties \
            project/android/signing/key.properties

          cp source/signing/sheti-release.jks \
            project/android/signing/sheti-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("project/android/app/build.gradle.kts")
          s = p.read_text()

          if "dev.flutter.flutter-gradle-plugin" not in s:
              raise SystemExit("Flutter Gradle plugin missing")

          s = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.example.sheti_app"',
              s
          )

          s = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.example.sheti_app"',
              s
          )

          s = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 25',
              s
          )

          s = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "4.3.0"',
              s
          )

          signing = '''
          val signingProperties = java.util.Properties()
          val signingFile = rootProject.file("signing/key.properties")

          if (!signingFile.exists()) {
              throw GradleException("Signing properties missing")
          }

          signingFile.inputStream().use {
              signingProperties.load(it)
          }

          '''

          if "val signingProperties = " not in s:
              s = s.replace("android {", signing + "android {", 1)

          config = '''
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file(
                          signingProperties.getProperty("storeFile")
                      )
                      storePassword =
                          signingProperties.getProperty("storePassword")
                      keyAlias =
                          signingProperties.getProperty("keyAlias")
                      keyPassword =
                          signingProperties.getProperty("keyPassword")
                  }
              }

          '''

          if 'create("release")' not in s:
              s = re.sub(
                  r'(?m)^(\s*)buildTypes\s*\{',
                  lambda m: config + m.group(0),
                  s,
                  count=1
              )

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = re.sub(
                  r'(getByName\("release"\)\s*\{)',
                  r'\1\n            signingConfig = signingConfigs.getByName("release")',
                  s,
                  count=1
              )

          p.write_text(s)

          if "\\\\n" in s:
              raise SystemExit("Unexpected literal newline escape in Gradle file")

          print("Gradle signing configuration prepared.")
          PY

          test -f project/android/app/build.gradle.kts

      - name: Get Dependencies
        working-directory: project
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        working-directory: project
        run: |
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -f project/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p release

          cp project/build/app/outputs/flutter-apk/app-release.apk \
            release/Sheti_V4_25.apk

      - name: Upload V25 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V25-APK
          path: release/Sheti_V4_25.apk
          if-no-files-found: error
          retention-days: 14
