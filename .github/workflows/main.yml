
name: Build and Verify Sheti V27 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V27 Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Sheti_V4_27_JVM_FIXED.zip"
          test -f "$ZIP"

          mkdir -p source
          unzip -q "$ZIP" -d source

          if [ -f source/pubspec.yaml ]; then
            ROOT="source"
          else
            ROOT="$(dirname "$(find source -name pubspec.yaml -print -quit)")"
          fi

          test -f "$ROOT/pubspec.yaml"
          cp -a "$ROOT"/. ./

          test -f lib/main.dart
          test -f signing/app_build.gradle
          test -f signing/key.properties
          test -f signing/sheti-release.jks

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          set -euo pipefail
          flutter create \
            --platforms=android \
            --project-name sheti_app \
            --org com.example .

      - name: Configure signing and JVM targets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/signing

          cp signing/key.properties \
            android/signing/key.properties
          cp signing/sheti-release.jks \
            android/signing/sheti-release.jks
          cp signing/app_build.gradle \
            android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          marker = 'id "org.jetbrains.kotlin.android"'
          plugin = 'id "dev.flutter.flutter-gradle-plugin"'

          if plugin not in s:
              if marker not in s:
                  raise SystemExit("Kotlin plugin marker missing")
              s = s.replace(marker, marker + "\n    " + plugin, 1)

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """, 1
              )
          else:
              s = re.sub(
                  r'sourceCompatibility\s+[^;\n]+',
                  'sourceCompatibility JavaVersion.VERSION_17',
                  s
              )
              s = re.sub(
                  r'targetCompatibility\s+[^;\n]+',
                  'targetCompatibility JavaVersion.VERSION_17',
                  s
              )

          if "kotlinOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              kotlinOptions {
                  jvmTarget = "17"
              }
          """, 1
              )
          else:
              s = re.sub(
                  r'jvmTarget\s*=\s*["\'][^"\']+["\']',
                  'jvmTarget = "17"',
                  s
              )

          if not re.search(r'\bflutter\s*\{', s):
              s += '\n\nflutter {\n    source = "../.."\n}\n'

          s += """

          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
          }

          tasks.withType(
              org.jetbrains.kotlin.gradle.tasks.KotlinCompile
          ).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

          p.write_text(s)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          mkdir -p release

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          AAPT="$(find "$SDK/build-tools" \
            -name aapt -type f | sort -V | tail -n 1)"

          "$AAPT" dump badging "$APK" \
            | tee release/package-info.txt

          grep -q "package: name='com.example.sheti_app'" \
            release/package-info.txt

          cp "$APK" release/Sheti_V4_27_arm64.apk

          sha256sum release/Sheti_V4_27_arm64.apk \
            > release/SHA256SUMS.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti_V4_27_APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
