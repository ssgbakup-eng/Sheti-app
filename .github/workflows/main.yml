
name: Sheti App V26 APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Extract V26 Source
        run: |
          test -f Sheti_V4_26.zip
          mkdir -p source
          unzip -q Sheti_V4_26.zip -d source
          test -f source/pubspec.yaml
          test -f source/lib/main.dart
          test -f source/signing/key.properties
          test -f source/signing/sheti-release.jks

      - name: Create Flutter Project
        run: |
          flutter create \
            --platforms=android \
            --project-name sheti_app \
            project

          cp source/pubspec.yaml project/pubspec.yaml

          rm -rf project/lib
          cp -r source/lib project/lib

          if [ -d source/assets ]; then
            mkdir -p project/assets
            cp -r source/assets/. project/assets/
          fi

      - name: Configure Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Android Gradle Kotlin file missing")

          s = p.read_text()

          if "compileOptions {" not in s:
              raise SystemExit("compileOptions block missing")

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s = s.replace(
              "jvmTarget = JavaVersion.VERSION_1_8.toString()",
              'jvmTarget = "17"'
          )

          s = s.replace(
              "jvmTarget = \"1.8\"",
              'jvmTarget = "17"'
          )

          p.write_text(s)
          PY

          mkdir -p project/android/signing

          cp source/signing/key.properties \
            project/android/signing/key.properties

          cp source/signing/sheti-release.jks \
            project/android/signing/sheti-release.jks

      - name: Get Dependencies
        working-directory: project
        run: |
          flutter clean
          flutter pub get

      - name: Build V26 Release APK
        working-directory: project
        run: |
          flutter build apk --release --split-per-abi

      - name: Verify APK
        run: |
          APK="project/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/Sheti_V4_26_ARM64.apk

      - name: Upload V26 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V26-APK
          path: release/Sheti_V4_26_ARM64.apk
          if-no-files-found: error
          retention-days: 14
