name: Build Sheti V24 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Extract V24 Source
        shell: bash
        run: |
          set -euo pipefail

          test -f Sheti_V4_24.zip
          rm -rf source
          mkdir -p source
          unzip -q Sheti_V4_24.zip -d source

          PUBSPEC="$(find source -type f -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -d lib
          test -f signing/key.properties
          test -f signing/sheti-release.jks

          flutter create . --platforms=android --org com.example

          mkdir -p android/signing
          cp signing/key.properties android/signing/key.properties
          cp signing/sheti-release.jks android/signing/sheti-release.jks

      - name: Configure Release Signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          cat > android/app/build.gradle <<'GRADLE'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          import java.util.Properties

          def props = new Properties()
          def propsFile = rootProject.file("signing/key.properties")

          if (!propsFile.exists()) {
              throw new GradleException("Signing properties missing")
          }

          propsFile.withInputStream { props.load(it) }

          android {
              namespace "com.example.sheti_app"
              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.example.sheti_app"
                  minSdk 23
                  targetSdk flutter.targetSdkVersion
                  versionCode 24
                  versionName "4.2.0"
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file(props["storeFile"])
                      storePassword props["storePassword"]
                      keyAlias props["keyAlias"]
                      keyPassword props["keyPassword"]
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source "../.."
          }
          GRADLE

      - name: Verify Configuration
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -F 'applicationId "com.example.sheti_app"' android/app/build.gradle
          grep -F 'versionCode 24' android/app/build.gradle
          grep -F 'versionName "4.2.0"' android/app/build.gradle

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("android/app/src/main/AndroidManifest.xml")
          print("Manifest XML valid")
          PY

      - name: Get Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Samsung S24 APK
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          flutter build apk --release --split-per-abi

      - name: Verify APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -lh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload V24 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheti-V24-S24-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
